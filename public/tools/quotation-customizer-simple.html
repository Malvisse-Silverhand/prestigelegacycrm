<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quotation Customizer (Simple) — Prestige Legacy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   QUOTATION CUSTOMIZER (SIMPLE) -- Kad Medikal i-Medi Evolusi sahaja.
   Standalone page opened in the CRM QuotationModal iframe with
   ?lead_id&name&phone&email&dob&gender&smoker. Rates + calculation are the
   same i-Medi Evolusi table used by imedi-evolusi-quote.html (monthly
   contribution per Age Next Birthday / gender / smoker / option).
   Saves through the same capture-quotation endpoint as the full customizer.
   ===================================================================== */
:root{
  --navy:#0f2540; --gold:#fac748; --cream:#fbf4e4;
  --ink:#0f2540; --muted:#5f6f81; --surface:#ffffff;
  --border:#e7dcc1; --line:#eee6d2; --ok:#1f7a4d; --warn:#b8860b; --danger:#c0392b;
  --radius:14px; --radius-sm:9px; --shadow:0 10px 30px rgba(15,37,64,.10);
  --font:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--cream);line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:14px 12px 60px}
button,input{font-family:inherit}

/* ---------- controls ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 14px 16px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.grid .full{grid-column:1/-1}
.field label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.field input[type=text],.field input[type=date]{
  width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px;font-size:14px;font-weight:600;color:var(--navy);background:#fff;min-height:42px}
.field input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(250,199,72,.35)}
.field input[readonly]{background:var(--cream);font-weight:800}
.seg{display:flex;border:1.5px solid var(--border);border-radius:9px;overflow:hidden;background:#fff}
.seg button{flex:1;border:0;background:transparent;padding:10px 6px;font-size:13px;font-weight:600;color:var(--navy);cursor:pointer;min-height:42px}
.seg button+button{border-left:1.5px solid var(--border)}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff}
.riders{display:flex;flex-direction:column;gap:8px}
.rider{display:flex;align-items:center;gap:10px;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;background:#fff;font-size:13px;font-weight:600;color:var(--navy);text-align:left;width:100%}
.rider .box{flex:0 0 22px;height:22px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;line-height:1}
.rider[aria-pressed=true]{border-color:var(--gold);background:#fffaf0}
.rider[aria-pressed=true] .box{background:var(--navy);border-color:var(--navy)}
.rider .txt{flex:1;min-width:0}
.rider small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.rider .price{font-weight:700;color:var(--warn);white-space:nowrap;font-size:12.5px}
.note{font-size:12px;color:var(--danger);font-weight:600;margin-top:8px;display:none}
.note.on{display:block}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 14px}
.btn{cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--navy);font-weight:600;font-size:13.5px;padding:11px 16px;border-radius:var(--radius-sm);min-height:44px;flex:1 1 140px}
.btn-primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow);z-index:50;max-width:90vw;display:none}
.toast.on{display:block}
.toast.ok{background:var(--ok)} .toast.err{background:var(--danger)} .toast.warn{background:var(--warn)}

/* ---------- the sheet (screenshot target) ---------- */
#sheet{background:#fff;border:1px solid #cfcfcf;padding:0;font-size:clamp(10.5px,2.9vw,14px);color:#111}
#sheet .band{text-align:center;font-weight:600;padding:6px 8px;margin:0}
#sheet .band-title{background:#e02bbd;color:#111;letter-spacing:.5px;margin:8px 8px 0;border:1px solid #333}
#sheet .band-name{background:#6fa8dc;color:#111;margin:6px 8px 8px;border:1px solid #333;text-transform:uppercase}
table.q{border-collapse:collapse;width:calc(100% - 16px);margin:0 8px 8px;table-layout:fixed}
table.q td,table.q th{border:1px solid #555;padding:4px 6px;vertical-align:middle;word-wrap:break-word;overflow-wrap:anywhere}
table.q col.c0{width:44%} table.q col.c1,table.q col.c2{width:28%}
table.q th{background:#999;color:#111;font-weight:800}
table.q th:first-child{text-align:left}
table.q td.v,table.q th.v{text-align:center}
table.q tr.sec td{font-weight:800;font-family:Georgia,'Times New Roman',serif;text-transform:none}
table.q tr.green td{background:#34a853;color:#111}
table.q tr.amber td{background:#ffd966}
table.q tr.mauve td{background:#c27ba0;font-weight:800}
table.q tr.rose td{background:#d5a6bd}
table.q tr.blue td{background:#6d9eeb}
table.q tr.lgreen td{background:#b6d7a8}
table.q td.c-o1{background:#9fc5e8} table.q td.c-o2{background:#b4a7d6}
table.q td.sm{font-size:.82em;line-height:1.35;color:#222}
table.q tr.total td{background:#e06666;font-weight:800;font-size:1.35em;padding:8px 6px;letter-spacing:.3px}
table.q tr.total td.v{white-space:nowrap}
.totnote{font-size:.72em;font-weight:600;display:block;letter-spacing:0;color:#3a0d0d}
table.r{border-collapse:collapse;width:calc(100% - 16px);margin:0 8px 10px;table-layout:fixed;background:#fff}
table.r col.c0{width:56%} table.r col.c1,table.r col.c2{width:22%}
table.r th{background:#f6eedb;text-align:left;font-weight:800;padding:9px 8px;font-size:.95em;border-bottom:1px solid #e3d8bd;letter-spacing:.3px}
table.r td{padding:9px 8px;border-bottom:1px solid #e9e1cd;vertical-align:middle}
table.r td.v{text-align:center;font-weight:500}
table.r td .tick{font-size:1.25em}
table.r td .add{display:block;color:#b8860b;font-weight:700;font-size:.85em;margin-top:3px}
table.r td .off{color:#aaa}
.foot{font-size:.72em;color:#666;text-align:center;padding:2px 10px 12px;line-height:1.4}
.na{margin:8px;padding:14px;background:#fff4e5;border:1px solid #f0d28f;border-radius:10px;font-weight:600;text-align:center;font-size:13px}

@media print{
  body{background:#fff}
  .noprint,.toast{display:none!important}
  .wrap{padding:0;max-width:none}
  #sheet{border:0;font-size:12px}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="card noprint">
    <h2>Butiran pelanggan &middot; Customer</h2>
    <div class="grid">
      <div class="field full"><label for="pfName">Nama / Name</label><input type="text" id="pfName" autocomplete="off" placeholder="Nama pelanggan"></div>
      <div class="field"><label for="pfDob">Tarikh lahir / DOB</label><input type="date" id="pfDob"></div>
      <div class="field"><label for="pfAge">Age next birthday</label><input type="text" id="pfAge" readonly value="-"></div>
      <div class="field"><label>Jantina / Gender</label>
        <div class="seg" id="segGender"><button type="button" data-v="male" aria-pressed="true">Lelaki</button><button type="button" data-v="female" aria-pressed="false">Perempuan</button></div></div>
      <div class="field"><label>Merokok / Smoker</label>
        <div class="seg" id="segSmoke"><button type="button" data-v="non" aria-pressed="true">Tidak</button><button type="button" data-v="smoke" aria-pressed="false">Ya</button></div></div>
    </div>
    <div class="note" id="naNote"></div>
  </div>

  <div class="card noprint">
    <h2>Rider &amp; Add-on</h2>
    <div class="riders" id="riders">
      <button type="button" class="rider" data-r="prov" aria-pressed="true"><span class="box">&#10003;</span><span class="txt">i-Provider Plus (Pelepasan Caruman)<small>Termasuk dalam pelan &middot; Included</small></span></button>
      <button type="button" class="rider" data-r="ward" aria-pressed="false"><span class="box">&#10003;</span><span class="txt">Elaun Wad + ICU<small>RM100/hari</small></span><span class="price">+RM14/bln</span></button>
      <button type="button" class="rider" data-r="waiver" aria-pressed="false"><span class="box">&#10003;</span><span class="txt">Pelepasan Bayaran Takaful (Payment Waiver)</span><span class="price">+RM20/bln</span></button>
    </div>
  </div>

  <div class="bar noprint">
    <button type="button" class="btn btn-primary" id="btnSave">Save quotation</button>
    <button type="button" class="btn" id="btnPrint">Print / PDF</button>
  </div>

  <div id="sheet"></div>
</div>
<div class="toast" id="toast"></div>

<script>

8.6|21:122.65:142.65|22:122.8:142.8|23:122.95:142.95|24:123.1:143.1|25:123.3:143.3|26:137.45:158.45|27:137.6:158.6|28:137.75:158.75|29:137.9:158.9|30:138.05:159.05|31:158.2:182.2|32:158.35:182.35|33:158.5:182.5|34:158.65:182.65|35:158.8:182.8|36:185.95:213.95|37:186.3:214.3|38:186.6:214.6|39:186.95:214.95|40:187.3:215.3|41:227.65:260.65|42:228.25:261.25|43:228.85:261.85|44:229.5:262.5|45:230.2:263.2|46:281.95:323.95|47:282.75:324.75|48:283.55:325.55|49:284.4:326.4|50:285.35:327.35|51:325.3:372.3|52:326.45:373.45|53:327.65:374.65|54:328.95:375.95|55:330.35:377.35|56:404.8:469.8|57:407.35:472.35|58:410.2:475.2|59:413.3:478.3|60:416.7:481.7","female_smoke":"18:120.45:139.45|19:120.7:139.7|20:120.95:139.95|21:124.2:144.2|22:124.55:144.55|23:124.95:144.95|24:125.3:145.3|25:125.7:145.7|26:140.1:161.1|27:140.6:161.6|28:141.1:162.1|29:141.65:162.65|30:142.2:163.2|31:162.8:186.8|32:163.4:187.4|33:164.1:188.1|34:164.75:188.75|35:165.5:189.5|36:193.25:221.25|37:194.1:222.1|38:194.95:222.95|39:195.85:223.85|40:196.85:224.85|41:237.85:270.85|42:238.95:271.95|43:240.1:273.1|44:241.3:274.3|45:242.6:275.6|46:294.95:336.95|47:296.4:338.4|48:297.95:339.95|49:299.6:341.6|50:301.3:343.3|51:342.1:389.1|52:344.45:391.45|53:346.95:393.95|54:349.65:396.65|55:352.45:399.45|56:428.5:493.5|57:433.4:498.4|58:438.8:503.8|59:444.7:509.7|60:451.2:516.2"};
  var T = {};
  Object.keys(RAW).forEach(function(k){
    T[k] = {};
    RAW[k].split('|').forEach(function(s){ var p = s.split(':'); T[k][+p[0]] = [parseFloat(p[1]), parseFloat(p[2])]; });
  });

  function anbOf(dob, now){
    var t2 = now || new Date(), b = new Date(dob);
    var a = t2.getFullYear() - b.getFullYear();
    var m = t2.getMonth() - b.getMonth();
    if(m < 0 || (m === 0 && t2.getDate() < b.getDate())) a--;
    return a + 1;
  }

  // Pure calculation. Returns { anb, base:[o1,o2], addons, totals:[o1,o2], na:null|msg }.
  function calc(o){
    var anb = anbOf(o.dob, o.now);
    var row = (o.dob && !isNaN(new Date(o.dob).getTime())) ? (T[o.gender + '_' + o.smoke] || {})[anb] : null;
    var addons = (o.ward ? ADDON_WARD : 0) + (o.waiver ? ADDON_WAIVER : 0);
    if(!row){
      var na = null;
      if(o.dob){
        na = anb > 60 ? 'Age next birthday ' + anb + ' is above the rate table (max 60). Rates need underwriting.'
           : (o.smoke === 'smoke' && anb < 18) ? 'Smoker rates start from age next birthday 18.'
           : 'No rate available for age next birthday ' + anb + '.';
      }
      return { anb:anb, base:null, addons:addons, totals:null, na:na };
    }
    var r2 = function(n){ return Math.round(n * 100) / 100; };
    return { anb:anb, base:row.slice(), addons:addons, totals:[r2(row[0] + addons), r2(row[1] + addons)], na:null };
  }
  window.__t4uSimpleCalc = calc; // exposed for verification

    h += '<tr class="mauve"><td>Deductible (Dalam setahun bayar sekali sahaja)</td><td class="v">RM 500</td><td class="v">RM 500</td></tr>';
    h += '<tr class="sec amber"><td colspan="3">Daily Hospital Allowance</td></tr>';
    h += '<tr><td>- Government Hospital</td>' + both(function(o){ return '<td class="v">RM ' + o.rb + '</td>'; }) + '</tr>';

    h += '<tr><td>Outpatient Dialysis Treatment</td><td class="v" rowspan="4">based on annual limit</td><td class="v" rowspan="4">based on annual limit</td></tr>';
    h += '<tr><td>Outpatient Cancer Treatment</td></tr>';
    h += '<tr><td>Pre Hospitalisation Benefit (120 days before)</td></tr>';
    h += '<tr><td>Post Hospitalisation (180 days after)</td></tr>';
    h += '<tr class="sec amber"><td colspan="3">Outpatient Treatment - At Clinic (PAY &amp; CLAIM)</td></tr>';
    var clinic = '&bull; Only pay 5% from total bill (up to RM500 per certificate year) for treatment at Clinics listed under The Great Journey';
    var dis = ['Dengue Fever','Zika Virus','Chikungunya Fever','Influenza A','Influenza B','HFMD','Bronchitis','Pneumonia'];
    dis.forEach(function(d, i){
      h += '<tr><td>- ' + d + '</td>' + (i === 0 ? '<td class="v" rowspan="8">' + clinic + '</td><td class="v" rowspan="8">' + clinic + '</td>' : '') + '</tr>';
    });
    h += '<tr class="rose"><td>Cash Value</td><td class="v">&#9989;</td><td class="v">&#9989;</td></tr>';
    h += '<tr class="blue"><td>Kenaikan Harga</td><td class="v">Setiap 5 tahun</td><td class="v">Setiap 5 tahun</td></tr>';
    h += '<tr class="lgreen"><td>Cover Sehingga Umur</td><td class="v">70 tahun</td><td class="v">70 tahun</td></tr>';
    var addNote = c.addons > 0 ? '<span class="totnote">termasuk add-on / incl. add-on +RM ' + fmt(c.addons) + '</span>' : '';
    h += '<tr class="total"><td>TOTAL CONTRIBUTION' + (c.addons > 0 ? '<span class="totnote">per bulan / per month</span>' : '') + '</td>' +
         both(function(o, i){ return '<td class="v">RM ' + fmt(c.totals[i]) + addNote + '</td>'; }) + '</tr>';
    h += '</table>';

    var tick = '<span class="tick">&#10003;</span>';
    var off = '<span class="off">&mdash;</span>';
    h += '<table class="r"><colgroup><col class="c0"><col class="c1"><col class="c2"></colgroup>';
    h += '<tr><th colspan="3">RIDER &amp; ADD-ON</th></tr>';
    h += '<tr><td>i-Provider Plus (Pelepasan Caruman)</td>' + both(function(){ return '<td class="v">' + (state.prov ? tick : off) + '</td>'; }) + '</tr>';
    h += '<tr><td>Elaun Wad + ICU</td>' + both(function(){ return '<td class="v">' + (state.ward ? 'RM100/hari<span class="add">+RM' + ADDON_WARD + '/bln</span>' : off) + '</td>'; }) + '</tr>';
    h += '<tr><td>Pelepasan Bayaran Takaful (Payment Waiver)</td>' + both(function(){ return '<td class="v">' + (state.waiver ? tick + '<span class="add">+RM' + ADDON_WAIVER + '/bln</span>' : off) + '</td>'; }) + '</tr>';
    h += '</table>';
    h += '<div class="foot">Caruman bulanan dianggarkan &amp; tertakluk kepada underwriting. Estimated monthly contribution, subject to underwriting.' +
         (agentName ? '<br>Quotation disediakan oleh ' + esc(agentName) + ', Great Eastern Takaful Berhad' : '') + '</div>';
    $('sheet').innerHTML = h;
  }

  /* ---------- inputs ---------- */
  function changed(){ render(); postDirty(true); }
  $('pfName').addEventListener('input', function(){ state.name = this.value; changed(); });
  $('pfDob').addEventListener('input', function(){ state.dob = this.value; changed(); });
  $('segGender').addEventListener('click', function(e){ var b = e.target.closest('button'); if(!b) return; state.gender = b.getAttribute('data-v'); setSeg('segGender', state.gender); changed(); });
  $('segSmoke').addEventListener('click', function(e){ var b = e.target.closest('button'); if(!b) return; state.smoke = b.getAttribute('data-v'); setSeg('segSmoke', state.smoke); changed(); });
  $('riders').addEventListener('click', function(e){ var b = e.target.closest('.rider'); if(!b) return; var k = b.getAttribute('data-r'); state[k] = !state[k]; changed(); });
  $('btnPrint').addEventListener('click', function(){ window.print(); });

  /* ---------- CRM integration ---------- */
  function applyState(){
    $('pfName').value = state.name; $('pfDob').value = state.dob;
    setSeg('segGender', state.gender); setSeg('segSmoke', state.smoke);
  }

  function prefill(){
    if(q.get('name')) state.name = q.get('name');
    if(q.get('dob')) state.dob = q.get('dob');
    var g = q.get('gender'); if(g === 'male' || g === 'female') state.gender = g;
    var s = q.get('smoker'); if(s === 'true') state.smoke = 'smoke'; else if(s === 'false') state.smoke = 'non';
    applyState(); render();
  }

  // Reopening a saved quotation restores the exact inputs it was saved with.
  async function restore(){
    if(!quotationId) return;
    try{
      var res = await fetch('/api/quotations/' + quotationId, { headers:{ 'Accept':'application/json' } });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      var body = await res.json(); var p = body.raw_payload;
      if(!p || !p.__simple_customizer || !p.inputs) return;
      var i = p.inputs;
      state.name = i.name || ''; state.dob = i.dob || '';
      state.gender = i.gender === 'female' ? 'female' : 'male';
      state.smoke = i.smoke === 'smoke' ? 'smoke' : 'non';
      state.prov = i.prov !== false; state.ward = !!i.ward; state.waiver = !!i.waiver;
      applyState(); render(); toast('Quotation loaded for editing.', 'ok');
    }catch(err){ toast('Could not load the saved quotation.', 'err'); }
  }

  async function loadSignoff(){
    try{
      var res = await fetch('/api/me', { headers:{ 'Accept':'application/json' } });
      if(!res.ok) return;
      var j = await res.json();
      if(j && j.fullName){ agentName = j.fullName; render(); }
    }catch(err){ /* standalone: no sign-off line */ }
  }

  function reportError(context, err){
    post({ type:'t4u-tool-error', context:context, message:(err && err.message) || String(err), stack: err && err.stack });
  }

  var saving = false;
  async function save(){
    if(saving) return;
    if(!leadId){ toast('Open this from a lead to save the quotation.', 'warn'); return; }
    var c = calc(state);
    if(!c.totals){ toast(c.na || 'Enter a date of birth first.', 'warn'); return; }
    var smokeTxt = state.smoke === 'smoke' ? 'Smoking' : 'Not smoking';
    var plans = OPTIONS.map(function(o, i){
      var monthly = c.totals[i];
      return {
        sort_order: i,
        plan_label: o.label + ' (' + o.limit + ' / RM' + o.rb + ' R&B)',
        monthly_contribution: monthly,
        annual_contribution: Math.round(monthly * 12 * 100) / 100,
        coverage_detail: {
          name: o.label, room_and_board: 'RM' + o.rb, annual_limit: 'RM' + o.limitNum.toLocaleString('en-US'),
          overall_medical_limit: o.limitNum, coverage_age: '70 tahun',
          base_monthly_contribution: c.base[i], addons_monthly: c.addons,
          i_provider_plus: state.prov, ward_icu_allowance: state.ward, payment_waiver: state.waiver
        }
      };
    });
    var payload = {
      type: 'Kad Medikal (i-Medi Evolusi) - Simple', tab: 'medical', lang: 'bm', created_at: new Date().toISOString(),
      customer: { name: state.name || '', dob: state.dob || '', anb: c.anb, gender: state.gender, smoker: state.smoke === 'smoke', smoking: smokeTxt, phone: q.get('phone') || '' },
      columns: plans.map(function(p){ return Object.assign({ name: p.plan_label, yearly_contribution: p.annual_contribution, monthly_contribution: p.monthly_contribution }, p.coverage_detail); }),
      // __customizer keeps this counted/editable as a customizer quotation across the CRM;
      // __simple_customizer routes a reopen back to this page; inputs rebuild the form.
      __customizer: true, __simple_customizer: true,
      inputs: { name: state.name, dob: state.dob, gender: state.gender, smoke: state.smoke, prov: state.prov, ward: state.ward, waiver: state.waiver }
    };
    saving = true; $('btnSave').disabled = true; toast('Saving to lead...');
    try{
      var res = await fetch(CAPTURE_QUOTATION_URL, {
        method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ lead_id: leadId, product: 'imedi_evolusi', language: 'bm', raw_payload: payload, plans: plans })
      });
      var json = await res.json().catch(function(){ return null; });
      if(!res.ok || !json || !json.quotation_id) throw new Error((json && json.error) || ('HTTP ' + res.status));
      toast('Saved to lead.', 'ok');
      postDirty(false);
      post({ type:'t4u-quotation-saved', quotation_id: json.quotation_id });
    }catch(err){
      toast('Save failed: ' + (err && err.message ? err.message : ''), 'err');
      reportError('save-simple', err);
    }finally{
      saving = false; $('btnSave').disabled = false;
    }
  }
  $('btnSave').addEventListener('click', save);

  /* ---------- init ---------- */
  prefill();
  restore();
  loadSignoff();
})();
</script>
</body>
</html>
