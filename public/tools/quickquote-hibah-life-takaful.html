<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickQuote Hibah / Life Takaful | Takaful4Us</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div id="qqh">
<div class="qqh-wrap">

  <!-- LANG -->
  <div class="qqh-langbar">
    <div class="qqh-lang" id="qqhLang">
      <button type="button" class="is-on" data-v="bm">BM</button>
      <button type="button" data-v="en">EN</button>
    </div>
  </div>

  <header class="qqh-head">
    <div class="qqh-badges">
      <span class="qqh-badge"><span class="qqh-dot"></span> i-Great Nova</span>
      <span class="qqh-badge"><span class="qqh-dot"></span> i-Great Chinta</span>
    </div>
    <h1><span class="qqh-h1a">QUICKQUOTE</span><span class="qqh-h1b" data-i18n="h1b"></span></h1>
    <p class="qqh-sub" data-i18n="sub"></p>
  </header>

  <!-- ===== FORM ===== -->
  <section class="qqh-card" id="qqhFormCard">
    <div class="qqh-step-label" data-i18n="step1"></div>

    <div class="qqh-grid2">
      <div class="qqh-field">
        <label for="qqhDob"><span data-i18n="dob"></span> <span class="qqh-req">*</span></label>
        <input type="date" id="qqhDob">
        <div class="qqh-hint" id="qqhAnbHint"></div>
      </div>
      <div class="qqh-field">
        <label><span data-i18n="gender"></span> <span class="qqh-req">*</span></label>
        <div class="qqh-seg" id="qqhGender">
          <button type="button" class="is-on" data-v="L" data-i18n="male"></button>
          <button type="button" data-v="P" data-i18n="female"></button>
        </div>
      </div>
    </div>

    <div class="qqh-grid2">
      <div class="qqh-field">
        <label><span data-i18n="smoker"></span> <span class="qqh-req">*</span></label>
        <div class="qqh-seg" id="qqhSmoker">
          <button type="button" class="is-on" data-v="0" data-i18n="no"></button>
          <button type="button" data-v="1" data-i18n="yes"></button>
        </div>
      </div>
      <div class="qqh-field">
        <label for="qqhOcc"><span data-i18n="occ"></span> <span class="qqh-req">*</span></label>
        <select id="qqhOcc" class="qqh-sel">
          <option value="1">1</option><option value="2">2</option>
          <option value="3">3</option><option value="4">4</option>
        </select>
        <div class="qqh-hint" data-i18n="occHint"></div>
      </div>
    </div>

    <div class="qqh-field">
      <label><span data-i18n="health"></span> <span class="qqh-req">*</span></label>
      <div class="qqh-seg" id="qqhHealth">
        <button type="button" class="is-on" data-v="0" data-i18n="no"></button>
        <button type="button" data-v="1" data-i18n="yes"></button>
      </div>
    </div>
    <div class="qqh-field" id="qqhHealthWrap" hidden>
      <label for="qqhHealthTxt" data-i18n="healthTxt"></label>
      <input type="text" id="qqhHealthTxt" placeholder="—">
      <div class="qqh-hint" data-i18n="healthHint"></div>
    </div>

    <div class="qqh-step-label" data-i18n="step2"></div>
    <div class="qqh-cols">
      <div class="qqh-col-pick"><div class="qqh-col-tag">Option 1</div><select class="qqh-sel qqh-plan" data-i="0"></select></div>
      <div class="qqh-col-pick"><div class="qqh-col-tag qqh-tag-gold">Option 2</div><select class="qqh-sel qqh-plan" data-i="1"></select></div>
      <div class="qqh-col-pick"><div class="qqh-col-tag">Option 3</div><select class="qqh-sel qqh-plan" data-i="2"></select></div>
    </div>

    <div class="qqh-field qqh-termwrap" id="qqhTermWrap" hidden>
      <label data-i18n="termLbl"></label>
      <div class="qqh-seg qqh-seg4" id="qqhTerm">
        <button type="button" class="is-on" data-v="E60" data-i18n="t60"></button>
        <button type="button" data-v="E70" data-i18n="t70"></button>
        <button type="button" data-v="T10" data-i18n="t10"></button>
        <button type="button" data-v="T20" data-i18n="t20"></button>
      </div>
      <div class="qqh-hint" data-i18n="termHint"></div>
    </div>

    <div class="qqh-minnote" data-i18n="planNote"></div>
    <a class="qqh-simlink" href="https://takaful4us.com/pelan-takaful/hibah/#frozenasset" target="_blank" rel="noopener">
      <span class="qqh-simicon">🧮</span><span data-i18n="simLink"></span>
    </a>

    <button type="button" class="qqh-btn" id="qqhGo" data-i18n="cta1"></button>
    <div class="qqh-err" id="qqhErr" hidden></div>
  </section>

  <!-- ===== RESULT ===== -->
  <section class="qqh-result" id="qqhResult" hidden>

    <div class="qqh-card qqh-hero">
      <div class="qqh-eyebrow" data-i18n="eyebrow"></div>
      <div class="qqh-tiers" id="qqhTiers"></div>
      <div class="qqh-flag" id="qqhFlag" hidden></div>
    </div>

    <!-- PROFILE CARD — muncul hanya selepas nama/telefon/emel diisi -->
    <div class="qqh-profile" id="qqhProfile" hidden>
      <div class="qqh-profile-bar" data-i18n="profBar"></div>
      <div class="qqh-profile-body">
        <div class="qqh-profile-name" id="qqhPName"></div>
        <div class="qqh-chips" id="qqhChips"></div>
        <div class="qqh-profile-grid" id="qqhPGrid"></div>
      </div>
    </div>

    <!-- LEAD GATE -->
    <div class="qqh-card qqh-gate" id="qqhGate">
      <div class="qqh-lock">🔒</div>
      <div class="qqh-sec-title" data-i18n="gateTitle"></div>
      <p class="qqh-note" data-i18n="gateNote"></p>
      <div class="qqh-grid2">
        <div class="qqh-field">
          <label for="qqhLName"><span data-i18n="lname"></span> <span class="qqh-req">*</span></label>
          <input type="text" id="qqhLName" autocomplete="name">
        </div>
        <div class="qqh-field">
          <label for="qqhLPhone"><span data-i18n="lphone"></span> <span class="qqh-req">*</span></label>
          <input type="tel" id="qqhLPhone" placeholder="0123456789" autocomplete="tel" inputmode="numeric">
        </div>
      </div>
      <div class="qqh-field">
        <label for="qqhLEmail"><span data-i18n="lemail"></span> <span class="qqh-req">*</span></label>
        <input type="email" id="qqhLEmail" placeholder="nama@email.com" autocomplete="email">
      </div>
      <button type="button" class="qqh-btn" id="qqhUnlock" data-i18n="cta2"></button>
      <div class="qqh-err" id="qqhLErr" hidden></div>
      <p class="qqh-privacy" data-i18n="privacy"></p>
    </div>

    <div class="qqh-locked" id="qqhLockedWrap">
      <div class="qqh-blurmask"></div>

      <div class="qqh-card">
        <div class="qqh-sec-title" data-i18n="benTitle"></div>
        <p class="qqh-note" data-i18n="benNote"></p>
        <div class="qqh-tblwrap"><table class="qqh-tbl" id="qqhTbl"></table></div>
        <p class="qqh-scrollhint" data-i18n="scrollHint"></p>
        <div class="qqh-lien" id="qqhLien" hidden></div>
      </div>

      <div class="qqh-card">
        <div class="qqh-sec-title" data-i18n="savTitle"></div>
        <p class="qqh-note" data-i18n="savNote"></p>
        <div class="qqh-tblwrap"><table class="qqh-tbl" id="qqhTblSav"></table></div>
        <p class="qqh-scrollhint" data-i18n="scrollHint"></p>
      </div>

      <div class="qqh-card">
        <div class="qqh-sec-title" data-i18n="noteTitle"></div>
        <p class="qqh-note" data-i18n="noteSub"></p>
        <div id="qqhNotes"></div>
      </div>

      <div class="qqh-card qqh-cta">
        <div class="qqh-sec-title" data-i18n="nextTitle"></div>
        <p class="qqh-note" data-i18n="nextNote"></p>
        <div class="qqh-cta-row">
          <a class="qqh-btn qqh-btn-wa" id="qqhWa" href="#" target="_blank" rel="noopener" data-i18n="ctaWa"></a>
          <button type="button" class="qqh-btn qqh-btn-ghost" id="qqhPrint" data-i18n="ctaPdf"></button>
        </div>
      </div>
    </div>

    <p class="qqh-disclaimer" data-i18n="disc"></p>
  </section>

  <!-- ===== LAPORAN CETAK/PDF — dibina secara dinamik, hanya nampak semasa print ===== -->
  <div class="qqh-report" id="qqhReport"></div>

  <footer class="qqh-foot">Takaful4Us · Kamal Husaini (MTA1462134) · <span data-i18n="foot"></span></footer>
</div>
</div>

<style>
#qqh{--nv:#0f2540;--gd:#fac748;--cr:#fdf9f3;--gr:#0f4c35;--ink:#12202f;--mut:#66768a;--ln:#e6dfd3;--wh:#fff;
  --nv-soft:#e8edf3;--sh:0 1px 2px rgba(15,37,64,.04),0 6px 18px -8px rgba(15,37,64,.14);
  --r-lg:20px;--r-md:14px;--r-sm:11px;
  font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--cr);color:var(--ink);
  padding:clamp(14px,3vw,26px) clamp(12px,3vw,18px) 40px;line-height:1.55;-webkit-font-smoothing:antialiased;box-sizing:border-box}
#qqh :focus-visible{outline:3px solid var(--gd);outline-offset:2px;border-radius:6px}
#qqh{overflow-x:hidden;max-width:100vw}
#qqh .qqh-tier,#qqh .qqh-col-pick,#qqh .qqh-pi,#qqh .qqh-field{min-width:0}
@media(prefers-reduced-motion:reduce){#qqh *,#qqh *::before,#qqh *::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
#qqh *,#qqh *::before,#qqh *::after{box-sizing:border-box}
#qqh [hidden]{display:none !important}
#qqh .qqh-wrap{max-width:900px;margin:0 auto}

#qqh .qqh-langbar{display:flex;justify-content:flex-end;margin-bottom:10px}
#qqh .qqh-lang{display:flex;gap:4px;background:var(--wh);border:1.5px solid var(--ln);border-radius:999px;padding:4px}
#qqh .qqh-lang button{font-family:inherit;font-size:12px;font-weight:700;color:var(--mut);background:transparent;
  border:0;border-radius:999px;padding:6px 16px;cursor:pointer;transition:all .2s cubic-bezier(.34,1.56,.64,1)}
#qqh .qqh-lang button.is-on{background:var(--nv);color:var(--wh)}

#qqh .qqh-head{text-align:center;margin-bottom:22px}
#qqh .qqh-badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#qqh .qqh-badge{display:inline-flex;align-items:center;gap:6px;background:var(--nv);color:var(--wh);font-size:11px;
  font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:6px 13px;border-radius:999px}
#qqh .qqh-dot{width:6px;height:6px;border-radius:50%;background:var(--gd);animation:qqhPulse 1.8s infinite}
@keyframes qqhPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}
#qqh .qqh-head h1{font-size:clamp(26px,6.2vw,40px);font-weight:800;color:var(--nv);margin:16px 0 8px;letter-spacing:-.03em;line-height:1.08}
#qqh .qqh-head h1 span{display:block}
#qqh .qqh-head h1 .qqh-h1b{color:var(--gd);-webkit-text-stroke:.6px var(--nv);margin-top:2px}
#qqh .qqh-sub{font-size:clamp(13px,2.6vw,15px);color:var(--mut);max-width:520px;margin:0 auto;text-wrap:balance}

#qqh .qqh-card{background:var(--wh);border:1px solid var(--ln);border-radius:var(--r-lg);padding:clamp(16px,3.4vw,24px);margin-bottom:16px;box-shadow:var(--sh)}
#qqh .qqh-step-label{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--nv);margin:4px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--ln)}
#qqh .qqh-step-label::before{content:"";width:5px;height:16px;border-radius:99px;background:var(--gd);flex:0 0 auto}
#qqh .qqh-step-label:not(:first-child){margin-top:24px}
#qqh .qqh-req{color:#c0392b}

#qqh .qqh-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#qqh .qqh-field{display:flex;flex-direction:column;margin-bottom:10px}
#qqh .qqh-field label{font-size:12.5px;font-weight:600;color:var(--nv);margin-bottom:6px}
#qqh .qqh-field input{font-family:inherit;font-size:15px;font-weight:500;color:var(--ink);background:var(--cr);
  border:1.5px solid var(--ln);border-radius:var(--r-sm);padding:13px 14px;outline:none;transition:border-color .18s,background .18s,box-shadow .18s;width:100%;min-height:46px}
#qqh .qqh-field input:focus{border-color:var(--gd);background:var(--wh);box-shadow:0 0 0 3px rgba(250,199,72,.22)}
#qqh .qqh-field input.is-bad{border-color:#e08b8b;background:#fff6f6}
#qqh .qqh-hint{font-size:11.5px;color:var(--mut);margin-top:5px;font-weight:500}
#qqh .qqh-hint b{color:var(--gr)}
#qqh .qqh-sel{width:100%;font-family:inherit;font-size:14px;font-weight:600;color:var(--nv);background:var(--cr);
  border:1.5px solid var(--ln);border-radius:12px;padding:12px 10px;outline:none;cursor:pointer}
#qqh .qqh-sel:focus{border-color:var(--gd)}

#qqh .qqh-seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--cr);border:1.5px solid var(--ln);border-radius:14px;padding:5px}
#qqh .qqh-seg4{grid-template-columns:repeat(4,minmax(0,1fr))}
#qqh .qqh-seg button{font-family:inherit;font-size:13px;font-weight:600;color:var(--mut);background:transparent;border:0;
  border-radius:10px;padding:11px 4px;cursor:pointer;transition:all .22s cubic-bezier(.34,1.56,.64,1)}
#qqh .qqh-seg button.is-on{background:var(--nv);color:var(--wh);box-shadow:0 3px 0 rgba(15,37,64,.18)}
#qqh .qqh-seg4 button{font-size:11.5px;padding:11px 2px}
#qqh .qqh-seg button.is-off{opacity:.32;cursor:not-allowed;text-decoration:line-through}

#qqh .qqh-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
#qqh .qqh-col-pick{background:var(--cr);border:1.5px solid var(--ln);border-radius:14px;padding:10px}
#qqh .qqh-col-tag{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--mut);text-align:center;margin-bottom:7px}
#qqh .qqh-col-tag.qqh-tag-gold{color:var(--nv);background:var(--gd);border-radius:99px;padding:2px 0}
#qqh .qqh-col-pick .qqh-sel{background:var(--wh);font-size:13px;padding:10px 6px}
#qqh .qqh-termwrap{margin-top:14px}
#qqh .qqh-minnote{font-size:11.5px;color:var(--mut);margin-top:12px;background:var(--cr);border-radius:10px;padding:10px 12px}
#qqh .qqh-simlink{display:flex;align-items:center;gap:9px;margin-top:10px;background:#fffdf5;border:1.5px dashed var(--gd);
  border-radius:12px;padding:12px 14px;font-size:12.5px;font-weight:600;color:var(--nv);text-decoration:none;transition:all .2s}
#qqh .qqh-simlink:hover{background:var(--gd);border-style:solid}
#qqh .qqh-simicon{font-size:16px;flex:0 0 auto}

#qqh .qqh-btn{display:block;width:100%;font-family:inherit;font-size:16px;font-weight:700;color:var(--nv);background:var(--gd);
  border:0;border-radius:14px;padding:16px;margin-top:22px;cursor:pointer;box-shadow:0 4px 0 var(--nv);
  transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .15s;text-align:center;text-decoration:none}
#qqh .qqh-btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--nv)}
#qqh .qqh-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--nv)}
#qqh .qqh-btn-wa{background:var(--gr);color:var(--wh);box-shadow:0 4px 0 #072a1d;margin-top:0}
#qqh .qqh-btn-wa:hover{box-shadow:0 6px 0 #072a1d}
#qqh .qqh-btn-ghost{background:var(--wh);color:var(--nv);border:1.5px solid var(--nv);box-shadow:0 4px 0 rgba(15,37,64,.18);margin-top:0}

#qqh .qqh-err{margin-top:14px;background:#fff3f3;border:1.5px solid #f2c9c9;color:#8d2b2b;border-radius:12px;padding:14px;font-size:13.5px;font-weight:500}
#qqh .qqh-err a{color:var(--gr);font-weight:700}

#qqh .qqh-result{animation:qqhIn .5s cubic-bezier(.34,1.4,.64,1) both}
@keyframes qqhIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

#qqh .qqh-profile{background:var(--wh);border:1px solid var(--ln);border-radius:20px;overflow:hidden;margin-bottom:16px}
#qqh .qqh-profile-bar{background:var(--gd);color:var(--nv);text-align:center;font-size:12px;font-weight:700;padding:9px 12px;letter-spacing:.03em}
#qqh .qqh-profile-body{padding:20px}
#qqh .qqh-profile-name{text-align:center;font-size:24px;font-weight:800;color:var(--nv);letter-spacing:-.02em}
#qqh .qqh-chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:10px}
#qqh .qqh-chip{font-size:11.5px;font-weight:600;color:var(--nv);background:var(--cr);border:1px solid var(--gd);border-radius:999px;padding:5px 12px}
#qqh .qqh-profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;margin-top:18px;border-top:1px solid var(--ln)}
#qqh .qqh-pi{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln);font-size:12.5px}
#qqh .qqh-pi span{color:var(--mut);font-weight:500}
#qqh .qqh-pi b{color:var(--nv);font-weight:600;text-align:right}

#qqh .qqh-hero{background:var(--nv);border-color:var(--nv);color:var(--wh);position:relative;overflow:hidden}
#qqh .qqh-hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:34px 34px;pointer-events:none}
#qqh .qqh-eyebrow{position:relative;z-index:1;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--gd);margin-bottom:14px;text-align:center}
#qqh .qqh-tiers{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
#qqh .qqh-tier{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:16px 12px;text-align:center;position:relative}
#qqh .qqh-tier.is-best::before{content:attr(data-ribbon);position:absolute;top:-9px;left:50%;transform:translateX(-50%);
  background:var(--gd);color:var(--nv);font-size:9.5px;font-weight:800;letter-spacing:.09em;padding:3px 11px;border-radius:99px;white-space:nowrap}
#qqh .qqh-tier.is-best{background:rgba(250,199,72,.13);border-color:var(--gd)}
#qqh .qqh-tier-name{font-size:11px;font-weight:700;letter-spacing:.04em;color:#8fa2b8}
#qqh .qqh-tier.is-best .qqh-tier-name{color:var(--gd)}
#qqh .qqh-tier-sc{font-size:14px;font-weight:700;color:var(--wh);margin:5px 0 9px}
#qqh .qqh-tier-amt{font-size:clamp(24px,5.6vw,29px);font-weight:800;color:var(--gd);letter-spacing:-.03em;line-height:1.05}
#qqh .qqh-tier-amt small{font-size:12px;font-weight:600;color:#b9c6d6}
#qqh .qqh-tier-yr{font-size:11px;color:#b9c6d6;font-weight:500;margin-top:4px}
#qqh .qqh-tier-delta{margin-top:9px;font-size:11px;font-weight:700;color:var(--nv);background:var(--gd);border-radius:99px;padding:4px 8px;display:inline-block}
#qqh .qqh-flag{position:relative;z-index:1;margin-top:14px;background:rgba(250,199,72,.14);border:1px solid rgba(250,199,72,.4);border-radius:12px;padding:11px 13px;font-size:12.5px;color:#ffe9b0;font-weight:500}

#qqh .qqh-gate{border:2px dashed var(--gd);background:linear-gradient(180deg,#fffdf7,var(--wh))}
#qqh .qqh-lock{font-size:26px;text-align:center;margin-bottom:6px}
#qqh .qqh-gate .qqh-sec-title,#qqh .qqh-gate .qqh-note{text-align:center}
#qqh .qqh-check{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--mut);font-weight:500;margin-top:6px;cursor:pointer}
#qqh .qqh-check input{margin-top:3px;width:17px;height:17px;accent-color:var(--gr);flex:0 0 auto}
#qqh .qqh-privacy{font-size:11px;color:var(--mut);text-align:center;margin:12px 0 0}

#qqh .qqh-locked{position:relative}
#qqh .qqh-locked.is-locked{max-height:400px;overflow:hidden;user-select:none}
#qqh .qqh-locked.is-locked > .qqh-card{filter:blur(5px);opacity:.75;pointer-events:none}
#qqh .qqh-blurmask{display:none;position:absolute;inset:0;z-index:2;
  background:linear-gradient(180deg,rgba(253,249,243,0) 30%,rgba(253,249,243,.9) 80%,var(--cr) 100%)}
#qqh .qqh-locked.is-locked .qqh-blurmask{display:block}

#qqh .qqh-sec-title{font-size:16px;font-weight:700;color:var(--nv);margin-bottom:4px}

  var L = 0; // 0=BM 1=EN
  function t(k,vars){
    var s=(T[k]&&T[k][L])||"";
    if(vars) for(var v in vars) s=s.split("{"+v+"}").join(vars[v]);
    return s;
  }

  var S={anb:null,dob:"",g:"L",s:0,occ:"1",health:0,healthTxt:"",term:"E60",
         pick:["n250","n350","c800"],unlocked:false,lead:{}};
  var CUR=null;

  var $=function(id){return document.getElementById(id);};
  function fmt(n,d){d=d||0;return Number(n).toLocaleString('en-MY',{minimumFractionDigits:d,maximumFractionDigits:d});}
  function esc(s){return String(s).replace(/[<>&"]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];});}
  function byId(id){ for(var i=0;i<CATALOG.length;i++) if(CATALOG[i].id===id) return CATALOG[i]; return null; }

  /* CRM prefill patch: read ?lead_id=&name=&phone=&email= so the gate form
     opens pre-populated when launched from a Lead Detail screen. The gate
     inputs are static markup (not template-rendered), so the value has to
     be set on the DOM elements directly, not just on S.lead. */
  var leadId='';
  (function prefillFromUrl(){
    var q=new URLSearchParams(location.search);
    leadId=q.get('lead_id')||'';
    var pn=q.get('name'),pp=q.get('phone'),pe=q.get('email');
    if(pn||pp||pe){
      S.lead={name:pn||'',phone:pp||'',email:pe||''};
      var n=$('qqhLName'),p=$('qqhLPhone'),e=$('qqhLEmail');
      if(n&&pn)n.value=pn;
      if(p&&pp)p.value=pp;
      if(e&&pe)e.value=pe;
    }
  })();

  /* ============ ANB ============ */
  function calcAnb(v){
    if(!v) return null;
    var d=new Date(v); if(isNaN(d)) return null;
    var n=new Date(),a=n.getFullYear()-d.getFullYear(),m=n.getMonth()-d.getMonth();
    if(m<0||(m===0&&n.getDate()<d.getDate())) a--;
    if(a<0||a>110) return null;
    return a+1;
  }

  /* ============ LOOKUPS ============ */
  function novaRec(){ return NOVA.filter(function(r){return r.g===S.g&&r.s===S.s&&r.a===S.anb;})[0]||null; }
  function novaRange(){
    var p=NOVA.filter(function(r){return r.g===S.g&&r.s===S.s;}).map(function(r){return r.a;});
    return p.length?{a:Math.min.apply(null,p),b:Math.max.apply(null,p)}:null;
  }
  function chintaPool(){
    return CHINTA.filter(function(r){return r.g===S.g&&r.s===S.s&&r.t===S.term;}).sort(function(a,b){return a.a-b.a;});
  }
  function chintaRec(){
    var p=chintaPool();
    if(!p.length) return {ok:false,reason:"combo"};
    var ex=p.filter(function(r){return r.a===S.anb;})[0];
    if(ex) return {ok:true,rec:ex,mode:"exact"};
    var lo=null,hi=null;
    for(var i=0;i<p.length;i++){ if(p[i].a<S.anb) lo=p[i]; if(p[i].a>S.anb&&!hi) hi=p[i]; }
    if(lo&&hi){
      var f=(S.anb-lo.a)/(hi.a-lo.a), mix=function(a,b){return (a==null||b==null)?null:a+(b-a)*f;};
      var n=Math.max(lo.sv.length,hi.sv.length),sv=[];
      for(var j=0;j<n;j++) sv.push(mix(lo.sv[j]||0,hi.sv[j]||0));
      var cov=(S.term==='T10')?S.anb+10:(S.term==='T20')?S.anb+20:(S.term==='E60'?60:70);
      return {ok:true,mode:"interp",lo:lo.a,hi:hi.a,rec:{a:S.anb,cov:cov,
        ct:(S.term==='T10'?10:S.term==='T20'?20:cov-S.anb),r:mix(lo.r,hi.r),w:mix(lo.w,hi.w),l:mix(lo.l,hi.l),sv:sv}};
    }
    return {ok:false,reason:"range",min:p[0].a,max:p[p.length-1].a};
  }

  /* ============ BUILD COLUMNS ============ */
  function build(){
    var needNova=false,needChinta=false;
    S.pick.forEach(function(id){ var p=byId(id); if(p.prod==='nova') needNova=true; else needChinta=true; });

    var nrec=null,crec=null,cmode=null,clo,chi;
    if(needNova){
      nrec=novaRec();
      if(!nrec){ var rg=novaRange();
        return {ok:false,prod:"Nova",range:rg}; }
    }
    if(needChinta){
      var cr=chintaRec();
      if(!cr.ok) return {ok:false,prod:"Chinta",range:(cr.reason==="range"?{a:cr.min,b:cr.max}:null)};
      crec=cr.rec; cmode=cr.mode; clo=cr.lo; chi=cr.hi;
    }

    var cols=S.pick.map(function(id,i){
      var p=byId(id);
      if(p.prod==='nova'){
        var sv=nrec.sv.map(function(row,j){return {y:(j+1)*5,amt:row[p.tier]};});
        return {i:i,id:id,prod:'nova',prodName:'Nova',sc:p.sc,monthly:nrec.m[p.tier],
          cov:nrec.pa,ct:nrec.pt,khairat:2000,haji:p.sc*2,
          loyalty:(L?"2% / 3% of annual contribution":"2% / 3% caruman tahunan"),
          waiverTxt:(nrec.w?t('included'):t('optional')),
          iSaver:t('optional'),sv:sv,flag:(nrec.f&&p.tier===0)?1:0};
      }
      var k=p.sc/1000;
      var svc=crec.sv.map(function(v,j){return {y:(j+1)*5,amt:(v||0)*k};});
      return {i:i,id:id,prod:'chinta',prodName:'Chinta',sc:p.sc,monthly:crec.r*k,
        cov:crec.cov,ct:crec.ct,khairat:5000,haji:p.sc*2,
        loyalty:(function(){var lr=(p.sc>=1000000&&crec.l4!=null)?crec.l4:crec.l; return lr!=null?('RM '+fmt(lr*k,2)):null;})(),
        waiverTxt:(crec.w!=null?('+RM '+fmt(crec.w*k,2)+t('perMonth')):t('optional')),
        iSaver:"—",sv:svc,flag:(crec.f?2:0)};
    });
    return {ok:true,cols:cols,cmode:cmode,clo:clo,chi:chi};
  }

  /* ============ RENDER ============ */
  function colTitle(c,i){ return "Option "+(i+1)+" ("+c.prodName+")"; }

  function renderTiers(){
    var c=CUR.cols;
    $('qqhTiers').innerHTML=c.map(function(x,i){
      var prev=(i>0?c[i-1].monthly:null);
      var delta=(prev!=null&&x.monthly>prev)?('+RM '+fmt(x.monthly-prev,2)+' vs Option '+i):null;
      return '<div class="qqh-tier'+(i===1?' is-best':'')+'" data-ribbon="'+t('ribbon')+'">'+
        '<div class="qqh-tier-name">'+colTitle(x,i)+'<\/div>'+
        '<div class="qqh-tier-sc">'+(L?"Hibah ":"Hibah ")+'RM '+fmt(x.sc)+'<\/div>'+
        '<div class="qqh-tier-amt">RM '+fmt(x.monthly,2)+'<small>'+t('perMonth')+'<\/small><\/div>'+
        '<div class="qqh-tier-yr">RM '+fmt(x.monthly*12,2)+' '+t('perYear')+'<\/div>'+
        (delta?'<div class="qqh-tier-delta">'+delta+'<\/div>':'')+
      '<\/div>';
    }).join('');
  }

  function head(first){
    return '<thead><tr><th class="qqh-lbl">'+(first||t('tBenefit'))+'<\/th>'+CUR.cols.map(function(x,i){
      return '<th'+(i===1?' class="is-best"':'')+'>'+colTitle(x,i)+'<small>RM '+fmt(x.sc)+'<\/small><\/th>';
    }).join('')+'<\/tr><\/thead>';
  }
  function row(label,def,vals,cls){
    return '<tr><th class="qqh-lbl">'+label+(def?'<span class="qqh-def">'+def+'<\/span>':'')+'<\/th>'+
      vals.map(function(v){return '<td'+(cls?' class="'+cls+'"':'')+'>'+v+'<\/td>';}).join('')+'<\/tr>';
  }

  function renderTable(){
    var c=CUR.cols,h='';
    h+=row(t('b1'),t('b1d'),c.map(function(x){return 'RM '+fmt(x.sc);}));
    h+=row(t('b2'),t('b2d'),c.map(function(x){return x.cov;}));
    h+=row(t('b3'),'',c.map(function(x){return x.ct+(L?' years':' tahun');}));
    h+=row(t('b4'),t('b4d'),c.map(function(x){return 'RM '+fmt(x.khairat);}));
    h+=row(t('b5'),t('b5d'),c.map(function(x){return 'RM '+fmt(x.haji);}));
    h+=row(t('b6'),t('b6d'),c.map(function(){return L?'4 persons':'4 orang';}));
    h+=row(t('b7'),t('b7d'),c.map(function(){return L?'Yes':'Ya';}),'qqh-yes');
    h+=row(t('b8'),t('b8d'),c.map(function(x){
      var f=x.sv.filter(function(s){return s.y===10;})[0];
      return (f&&f.amt>0)?('RM '+fmt(f.amt)):'—';}));
    h+=row(t('b9'),t('b9d'),c.map(function(x){return x.loyalty||'—';}));
    h+='<tr class="qqh-sub"><th colspan="4">'+t('rSub')+'<\/th><\/tr>';
    h+=row(t('r1'),t('r1d'),c.map(function(x){return x.waiverTxt;}),'qqh-opt');
    h+=row(t('r2'),t('r2d'),c.map(function(){return t('optional');}),'qqh-opt');
    h+=row(t('r3'),t('r3d'),c.map(function(){return t('optional');}),'qqh-opt');
    h+=row(t('r4'),t('r4d'),c.map(function(x){return x.iSaver;}),'qqh-opt');
    h+='<tr class="qqh-total"><th class="qqh-lbl">'+t('tMon')+'<\/th>'+
      c.map(function(x){return '<td>RM '+fmt(x.monthly,2)+'<\/td>';}).join('')+'<\/tr>';
    h+='<tr class="qqh-total"><th class="qqh-lbl">'+t('tAnn')+'<\/th>'+
      c.map(function(x){return '<td>RM '+fmt(x.monthly*12,2)+'<\/td>';}).join('')+'<\/tr>';
    $('qqhTbl').innerHTML=head()+'<tbody>'+h+'<\/tbody>';

    var lien=$('qqhLien'), hasNova=c.some(function(x){return x.prod==='nova';});
    if(S.anb<=5&&hasNova){
      lien.hidden=false;
      lien.innerHTML=t('lien',{n:S.anb,p:({1:'20%',2:'40%',3:'60%',4:'80%',5:'100%'})[S.anb]});
    } else lien.hidden=true;
  }

  function renderSav(){
    var c=CUR.cols,h='',any=false;

    });
    $('qqhTblSav').innerHTML=any?(head(t('tPeriod'))+'<tbody>'+h+'<\/tbody>'):'<tbody><tr><td>—<\/td><\/tr><\/tbody>';

  function buildPlanSelects(){
    var sels=document.querySelectorAll('#qqh .qqh-plan');
    for(var i=0;i<sels.length;i++){
      (function(sel,idx){
        sel.innerHTML=CATALOG.filter(function(p){return !p.hidden;}).map(function(p){
          return '<option value="'+p.id+'"'+(p.id===S.pick[idx]?' selected':'')+'>RM '+fmt(p.sc)+' ('+PRODNAME[p.prod]+')<\/option>';
        }).join('');
      })(sels[i],Number(sels[i].getAttribute('data-i')));
    }
  }

  function termAvailable(code){
    if(!S.anb) return true;
    return CHINTA.some(function(r){return r.g===S.g&&r.s===S.s&&r.t===code&&r.a===S.anb;});
  }
  function syncTermVisibility(){
    var anyChinta=S.pick.some(function(id){return byId(id).prod==='chinta';});
    $('qqhTermWrap').hidden=!anyChinta;
    if(!anyChinta) return;
    var btns=$('qqhTerm').querySelectorAll('button'), firstOk=null, curOk=false;
    for(var i=0;i<btns.length;i++){
      var code=btns[i].getAttribute('data-v'), ok=termAvailable(code);
      btns[i].disabled=!ok;
      btns[i].classList.toggle('is-off',!ok);
      if(ok&&!firstOk) firstOk=code;
      if(ok&&code===S.term) curOk=true;
    }
    if(!curOk&&firstOk){
      S.term=firstOk;
      for(var j=0;j<btns.length;j++) btns[j].classList.toggle('is-on',btns[j].getAttribute('data-v')===firstOk);
    }
  }

  /* ============ WIRING ============ */
  function segWire(id,key,cast,after){
    var box=$(id);
    box.addEventListener('click',function(e){
      var b=e.target.closest('button'); if(!b) return;
      var bs=box.querySelectorAll('button');
      for(var i=0;i<bs.length;i++) bs[i].classList.remove('is-on');
      b.classList.add('is-on');
      S[key]=cast?cast(b.getAttribute('data-v')):b.getAttribute('data-v');
      if(after) after();
    });
  }
  segWire('qqhGender','g',null,syncTermVisibility); segWire('qqhSmoker','s',Number,syncTermVisibility); segWire('qqhTerm','term');
  segWire('qqhHealth','health',Number,function(){ $('qqhHealthWrap').hidden=!S.health; });

  $('qqhLang').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    var bs=this.querySelectorAll('button');
    for(var i=0;i<bs.length;i++) bs[i].classList.remove('is-on');
    b.classList.add('is-on');
    L=(b.getAttribute('data-v')==='en')?1:0;
    paintStatic();
    if(CUR) renderAll();
  });

  document.addEventListener('change',function(e){
    if(e.target.classList&&e.target.classList.contains('qqh-plan')){
      S.pick[Number(e.target.getAttribute('data-i'))]=e.target.value;
      syncTermVisibility();
    }
  });
  $('qqhOcc').addEventListener('change',function(){ S.occ=this.value; });
  $('qqhHealthTxt').addEventListener('input',function(){ S.healthTxt=this.value.trim(); });
  $('qqhDob').addEventListener('change',function(){
    S.dob=this.value; S.anb=calcAnb(this.value);
    $('qqhAnbHint').innerHTML=S.anb?t('anbIs',{n:S.anb}):t('anbAuto');
    syncTermVisibility();
  });

  $('qqhGo').addEventListener('click',function(){
    var err=$('qqhErr');
    if(!S.anb){ err.hidden=false; err.innerHTML=t('errDob'); return; }
    if(S.pick[0]===S.pick[1]||S.pick[1]===S.pick[2]||S.pick[0]===S.pick[2]){
      err.hidden=false; err.innerHTML=t('errDup'); return; }
    var r=build();
    if(!r.ok){
      err.hidden=false;
      var m=r.range?t('errRange',{p:r.prod,a:r.range.a,b:r.range.b,n:S.anb}):t('errCombo',{p:r.prod});
      err.innerHTML=m+'<br><br>'+t('errWa',{w:WA});
      $('qqhResult').hidden=true; return;
    }
    err.hidden=true; CUR=r;
    $('qqhResult').hidden=false;
    if(!S.unlocked) $('qqhLockedWrap').classList.add('is-locked');
    renderAll();
    $('qqhResult').scrollIntoView({behavior:'smooth',block:'start'});
  });

  function badPhone(v){ var d=v.replace(/\D/g,''); return !(d.length>=9&&d.length<=13); }
  function badEmail(v){ return !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v); }

  $('qqhUnlock').addEventListener('click',function(){
    var n=$('qqhLName'),p=$('qqhLPhone'),e=$('qqhLEmail'),err=$('qqhLErr');
    var bad=[];
    n.classList.toggle('is-bad',n.value.trim().length<3); if(n.value.trim().length<3) bad.push(t('fName'));
    p.classList.toggle('is-bad',badPhone(p.value)); if(badPhone(p.value)) bad.push(t('fPhone'));
    e.classList.toggle('is-bad',badEmail(e.value.trim())); if(badEmail(e.value.trim())) bad.push(t('fEmail'));
    if(bad.length){ err.hidden=false; err.innerHTML=t('errFill',{x:bad.join(', ')}); return; }
    err.hidden=true;

    S.lead={name:n.value.trim(),phone:p.value.trim(),email:e.value.trim()};
    S.unlocked=true;
    $('qqhLockedWrap').classList.remove('is-locked');
    $('qqhGate').innerHTML='<div class="qqh-lock">🔓<\/div><div class="qqh-sec-title" style="text-align:center">'+
      t('thanks',{n:esc(S.lead.name.split(' ')[0])})+'<\/div><p class="qqh-note" style="text-align:center;margin:0">'+
      t('thanksNote')+'<\/p>';
    renderProfile(); buildWa(); sendLead(); sendSocialNotification();
    $('qqhLockedWrap').scrollIntoView({behavior:'smooth',block:'start'});
  });

  /* ============ PABBLY WEBHOOK ============ */
  function sendLead(){
    if(!PABBLY_ENDPOINT||!CUR) return;
    var c=CUR.cols, dt=new Date();
    var p={
      timestamp:dt.toISOString(),
      source:"QuickQuote Hibah",
      language:L?"EN":"BM",
      name:S.lead.name, phone:S.lead.phone, email:S.lead.email,
      date_of_birth:S.dob, anb:S.anb,
      gender:(S.g==='L'?"Lelaki":"Perempuan"),
      smoker:(S.s?"Ya":"Tidak"),
      occupation_class:S.occ,
      health_history:(S.health?"Ya":"Tidak"),
      health_notes:(S.health?S.healthTxt:""),
      chinta_term:S.term
    };
    c.forEach(function(x,i){
      var n=i+1;
      p["plan"+n+"_product"]="i-Great "+x.prodName;
      p["plan"+n+"_sum_covered"]=x.sc;
      p["plan"+n+"_monthly"]=Number(x.monthly.toFixed(2));
      p["plan"+n+"_annual"]=Number((x.monthly*12).toFixed(2));
      p["plan"+n+"_coverage_to_age"]=x.cov;
      p["plan"+n+"_payment_term"]=x.ct;
    });
    p.quotation_date=("0"+dt.getDate()).slice(-2)+"/"+("0"+(dt.getMonth()+1)).slice(-2)+"/"+dt.getFullYear();
    try{
      fetch(PABBLY_ENDPOINT,{method:'POST',mode:'no-cors',
        headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});
    }catch(err){}

    /* CRM fan-out patch: additive, does not replace the Pabbly call above. */
    if(leadId&&CAPTURE_QUOTATION_URL){
      try{
        var prods=c.map(function(x){return x.prod;});
        var uniqueProds=prods.filter(function(v,i){return prods.indexOf(v)===i;});
        var product=uniqueProds.length>1?'hibah_mixed':(uniqueProds[0]==='nova'?'hibah_nova':'hibah_chinta');
        var cqPlans=c.map(function(x,i){
          return {
            sort_order:i,
            plan_label:'Option '+(i+1)+' ('+x.prodName+')',
            monthly_contribution:Number(x.monthly.toFixed(2)),
            annual_contribution:Number((x.monthly*12).toFixed(2)),
            coverage_detail:{product:x.prodName,sum_covered:x.sc,coverage_to_age:x.cov,payment_term:x.ct}
          };
        });
        var cqBody={lead_id:leadId,product:product,language:(L?"EN":"BM"),raw_payload:p,plans:cqPlans};
        fetch(CAPTURE_QUOTATION_URL,{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify(cqBody),keepalive:true});
      }catch(err){}
    }
  }

  /* ============ SOCIAL NOTIFICATION WEBHOOK ============
     Skema field (input_17, input_18, dst.) ditetapkan oleh servis pihak ketiga —
     BUKAN dicipta oleh kita. Mengikut arahan Mal: hanya NAMA dihantar ke servis ni,
     semua field lain (DOB, jantina, merokok, telefon, dll.) sengaja dihantar null. */
  function genSessionToken(){
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
      var r=Math.random()*16|0, v=(c==='x')?r:(r&0x3|0x8);
      return v.toString(16);
    });
  }
  function splitName(nm){
    var parts=(nm||'').trim().split(/\s+/).filter(Boolean);
    return {first:parts[0]||null, last:(parts.length>1?parts.slice(1).join(' '):null)};
  }
  function sendSocialNotification(){
    if(!SOCIAL_ENDPOINT) return;
    var nm=splitName(S.lead.name);
    var payload={
      first_name:nm.first,
      city:null,
      state:null,
      country:null,
      country_code:null,
      input_17:null,
      input_18:null,
      input_19:null,
      input_20:null,
      input_22:null,
      input_23:null,
      input_25:null,
      input_27:null,
      input_29:null,
      input_32:null,
      input_33:null,
      input_1_3:nm.first,
      input_1_6:nm.last,
      input_4_3:null,
      session_token:genSessionToken()
    };
    try{
      fetch(SOCIAL_ENDPOINT,{method:'POST',mode:'no-cors',
        headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    }catch(err){}
  }

  function renderReport(){
    if(!CUR){ $('qqhReport').innerHTML=''; return; }
    var c=cols_report(), dt=new Date();
    var qd=("0"+dt.getDate()).slice(-2)+"/"+("0"+(dt.getMonth()+1)).slice(-2)+"/"+dt.getFullYear();
    var dobTxt=S.dob?S.dob.split('-').reverse().join('/'):'—';

    function infoRow(l,v){ return '<div class="qqh-r-row"><span>'+l+'<\/span><b>'+v+'<\/b><\/div>'; }

    var head='<div class="qqh-r-head">'+
      '<div><div class="qqh-r-title">QuickQuote — Hibah/Life Takaful<\/div>'+
      '<div class="qqh-r-sub">'+t('rCompanyReg')+'<\/div><\/div>'+
      '<div class="qqh-r-brand"><div class="qqh-r-brandname">TAKAFUL4US<\/div>'+
      '<div class="qqh-r-mta">MTA1462134<\/div><\/div><\/div>';

    var info='<div class="qqh-r-info">'+
      '<div class="qqh-r-infotitle">'+t('rFor')+': <b>'+(S.lead.name?esc(S.lead.name):'—')+'<\/b><\/div>'+
      '<div class="qqh-r-grid">'+
        infoRow(t('pDob'),dobTxt)+infoRow(t('rAnb'),(S.anb!=null?S.anb:'—'))+
        infoRow(t('gender'),S.g==='L'?t('male'):t('female'))+infoRow(t('smoker'),S.s?t('yes'):t('no'))+
        infoRow(t('pPhone'),S.lead.phone?esc(S.lead.phone):'—')+infoRow(t('pOcc'),(L?'Class ':'Kelas ')+S.occ)+
        infoRow(t('pEmail'),S.lead.email?esc(S.lead.email):'—')+infoRow(t('pDate'),qd)+
        infoRow(t('pHealth'),S.health?(S.healthTxt?esc(S.healthTxt):t('yes')):t('pNone'))+
      '<\/div><\/div>';

    var price='<div class="qqh-r-price">'+c.map(function(x,i){
      return '<div class="qqh-r-pcard'+(i===1?' is-best':'')+'">'+
        '<div class="qqh-r-pname">'+colTitle(x,i)+'<\/div>'+
        '<div class="qqh-r-psc">Hibah RM '+fmt(x.sc)+'<\/div>'+
        '<div class="qqh-r-pamt">~RM '+fmt(x.monthly,2)+'<small>'+t('perMonth')+'<\/small><\/div>'+
        '<div class="qqh-r-pyr">= RM '+fmt(x.monthly*12,2)+' '+t('perYear')+'<\/div>'+
      '<\/div>';
    }).join('')+'<\/div>';

    var mainTbl='<table class="qqh-tbl">'+($('qqhTbl').innerHTML||'')+'<\/table>';
    var savTbl='<div class="qqh-r-sectitle">'+t('savTitle')+'<\/div><table class="qqh-tbl">'+($('qqhTblSav').innerHTML||'')+'<\/table>';

    var foot='<div class="qqh-r-foot">'+t('disc')+'<\/div>'+
      '<div class="qqh-r-foot2">'+t('rCompanyReg')+' &middot; '+t('rAgent')+': Kamal Husaini (MTA1462134)<\/div>';

    $('qqhReport').innerHTML=head+info+price+mainTbl+savTbl+foot;
  }
  function cols_report(){ return CUR.cols; }

  $('qqhPrint').addEventListener('click',function(){ renderReport(); window.print(); });

  paintStatic(); syncTermVisibility();
})();
</script>
