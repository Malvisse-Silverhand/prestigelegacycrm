<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quotation Customizer — Prestige Legacy</title>
<style>html,body{margin:0;padding:0;background:#fbf4e4}</style>
</head>
<body>
<!-- =====================================================================
   TAKAFUL4US — QUOTATION CUSTOMIZER (Kad Medikal i-Medi Evolusi + Hibah)
   Single-file embed untuk WordPress Custom HTML block.
   ---------------------------------------------------------------------
   ★ TETAPAN — isi nilai di bawah dalam blok <script> "CONFIG":
     1. PABBLY_WEBHOOK_URL  — URL webhook Pabbly Connect (untuk butang Simpan)
     2. LOGO_GREAT_EASTERN  — logo Great Eastern Takaful (kanan) — sudah embed
     3. LOGO_GREAT_JOURNEY  — URL logo The Great Journey (kiri, medical sahaja)
     4. AGENT_PHONE         — no. telefon (format antarabangsa, cth 60123456789)
   Kalau logo dibiar kosong, ia tunjuk badge teks ganti (takkan pecah).
   ===================================================================== -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<div id="t4u-qc" class="tab-medical">
  <style>
  /* ---------- TOKENS (Takaful4Us brand) ---------- */
  #t4u-qc{
    --navy:#0f2540; --gold:#fac748; --cream:#fbf4e4;
    --get-red:#e3001b; --get-red-dk:#b3000f;
    --ink:#0f2540; --muted:#5f6f81; --surface:#ffffff;
    --bg:#fbf4e4; --border:#e7dcc1; --line:#eee6d2;
    --ok:#1f7a4d; --warn:#b8860b; --danger:#c0392b;
    --radius:14px; --radius-sm:9px; --shadow:0 10px 30px rgba(15,37,64,.10);
    --font:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;

    font-family:var(--font); color:var(--ink); background:var(--bg);
    line-height:1.45; box-sizing:border-box;
    max-width:1600px; width:100%; margin:0 auto; padding:18px clamp(10px,2vw,26px) 60px;
  }
  #t4u-qc *,#t4u-qc *::before,#t4u-qc *::after{box-sizing:border-box}
  #t4u-qc button{font-family:inherit}

  /* ---------- HEADER / BRAND ---------- */
  #t4u-qc .qc-brand{
    display:flex; align-items:center; gap:16px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:16px 22px; box-shadow:var(--shadow);
  }
  #t4u-qc .qc-logo{display:flex; align-items:center; min-height:46px; flex:0 0 auto}
  #t4u-qc .qc-logo img{max-height:48px; width:auto; display:block}
  #t4u-qc .qc-logo-right{
    width:75px; height:50px; flex:0 0 75px;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  #t4u-qc .qc-logo-right img{width:100%; height:100%; object-fit:contain}   /* saiz tetap 75x50, tiada stretch */
  #t4u-qc .qc-logo .fallback{
    font-weight:800; font-size:13px; letter-spacing:.3px; padding:8px 12px;
    border-radius:8px; border:1.5px dashed var(--border); color:var(--muted); white-space:nowrap;
  }
  #t4u-qc .qc-logo-left .fallback{font-size:9px; padding:5px 9px; letter-spacing:.2px}
  #t4u-qc .qc-logo-left{order:0}
  #t4u-qc .qc-head-mid{flex:1 1 auto; text-align:center; min-width:0}
  #t4u-qc .qc-logo-right{order:3}
  #t4u-qc .qc-head-mid .eyebrow{
    font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--get-red);
  }
  #t4u-qc.tab-hibah .qc-head-mid .eyebrow{color:var(--navy)}
  #t4u-qc .qc-head-mid h1{margin:2px 0 0; font-size:clamp(13px,1.4vw,17px); font-weight:800; color:var(--navy)}
  /* logo kiri (The Great Journey) hanya untuk medical */
  #t4u-qc.tab-hibah .qc-logo-left{display:none}

  /* ---------- TAB PILLS ---------- */
  #t4u-qc .qc-pills{display:flex; gap:8px; margin:16px 0 12px; flex-wrap:wrap}
  #t4u-qc .qc-pill{
    flex:1 1 200px; cursor:pointer; border:1.5px solid var(--border); background:var(--surface);
    color:var(--navy); font-weight:700; font-size:14px; padding:13px 16px; border-radius:999px;
    display:flex; align-items:center; justify-content:center; gap:9px; transition:.18s;
  }
  #t4u-qc .qc-pill small{font-weight:500; color:var(--muted); font-size:12px}
  #t4u-qc .qc-pill:hover{border-color:var(--gold); transform:translateY(-1px)}
  #t4u-qc .qc-pill.active{background:var(--navy); color:#fff; border-color:var(--navy)}
  #t4u-qc .qc-pill.active small{color:rgba(255,255,255,.7)}
  #t4u-qc .qc-pill .dot{width:9px;height:9px;border-radius:50%;background:var(--get-red)}
  #t4u-qc .qc-pill:nth-child(2) .dot{background:var(--gold)}

  /* ---------- PROFILE CARD ---------- */
  #t4u-qc .qc-profile{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:14px 18px; margin-top:12px;
    display:grid; grid-template-columns:repeat(4,1fr); gap:12px 16px;
  }
  #t4u-qc .qc-pfield label{display:block; font-size:10.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); margin-bottom:5px}
  #t4u-qc .qc-pfield input{
    width:100%; border:1.5px solid var(--border); border-radius:8px; padding:9px 10px;
    font-family:inherit; font-size:13.5px; font-weight:600; color:var(--navy); background:#fff; transition:.15s;
  }
  #t4u-qc .qc-pfield input:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(250,199,72,.35)}
  #t4u-qc .qc-pfield.age input{background:var(--cream); color:var(--navy); font-weight:800}

  /* ---------- BOTTOM ACTION BAR ---------- */
  #t4u-qc .qc-toolbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:14px}
  #t4u-qc .btn{
    cursor:pointer; border:1.5px solid var(--border); background:var(--surface); color:var(--navy);
    font-weight:600; font-size:13px; padding:10px 14px; border-radius:var(--radius-sm);
    display:inline-flex; align-items:center; gap:7px; transition:.15s; white-space:nowrap;
  }
  #t4u-qc .btn:hover{transform:translateY(-1px); box-shadow:0 4px 12px rgba(15,37,64,.12)}
  #t4u-qc .btn:active{transform:translateY(0)}
  #t4u-qc .btn svg{width:16px;height:16px;flex:0 0 auto}
  #t4u-qc .btn-primary{background:var(--navy); color:#fff; border-color:var(--navy)}
  #t4u-qc .btn-add{background:var(--gold); color:var(--navy); border-color:var(--gold)}
  #t4u-qc .btn-wa{background:#25D366; color:#073b21; border-color:#25D366}
  #t4u-qc .btn .sp{flex:1}

  /* language toggle */
  #t4u-qc .lang-toggle{display:inline-flex; border:1.5px solid var(--border); border-radius:999px; overflow:hidden; background:var(--surface); flex:0 0 auto}
  #t4u-qc .lang-btn{border:none; background:transparent; color:var(--muted); font-weight:800; font-size:12px; padding:10px 15px; cursor:pointer; transition:.15s; letter-spacing:.4px}
  #t4u-qc .lang-btn.active{background:var(--navy); color:#fff}
  #t4u-qc .lang-btn:hover:not(.active){background:var(--cream)}

  /* ---------- TABLE ---------- */
  #t4u-qc .qc-export{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; margin-top:14px}
  #t4u-qc .qc-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
  #t4u-qc table.qc-table{border-collapse:collapse; width:100%; min-width:600px; font-size:13px}
  #t4u-qc .qc-table th,#t4u-qc .qc-table td{border-bottom:1px solid var(--line); padding:10px 12px; vertical-align:middle; text-align:left}
  #t4u-qc .qc-table thead th{background:var(--navy); color:#fff; font-weight:700; font-size:12.5px; position:sticky; top:0; text-align:center}
  #t4u-qc.tab-medical .qc-table thead th{background:linear-gradient(180deg,var(--get-red),var(--get-red-dk))}
  /* lajur nama benefit — GOLD */
  #t4u-qc .qc-table td.lbl,#t4u-qc .qc-table th.lbl{
    position:sticky; left:0; z-index:2; background:var(--gold); color:var(--navy);
    width:190px; min-width:190px; max-width:190px; box-shadow:1px 0 0 var(--border);
  }
  #t4u-qc .qc-table thead th.lbl{background:var(--gold); color:var(--navy); z-index:5; text-align:center}
  #t4u-qc .qc-table tbody td.lbl{background:#fdedb8; font-weight:700}
  /* lajur description (collapsible) — warna sama dgn lajur benefit supaya blend bila collapsed */
  #t4u-qc .qc-table th.desc,#t4u-qc .qc-table td.desc{
    min-width:230px; max-width:280px; font-size:12px; color:#6f5d28; background:#fdedb8;
    position:sticky; left:190px; z-index:1; box-shadow:1px 0 0 var(--border); transition:.15s;
  }
  #t4u-qc .qc-table thead th.desc{
    background:var(--gold); color:var(--navy); z-index:4; cursor:pointer; user-select:none;
    display:table-cell; vertical-align:middle;
  }
  #t4u-qc .desc-head{display:flex; align-items:center; justify-content:center; gap:6px}
  #t4u-qc .desc-ic{font-weight:800; font-size:16px; line-height:1}
  #t4u-qc.desc-collapsed .qc-table th.desc,#t4u-qc.desc-collapsed .qc-table td.desc{
    min-width:26px; max-width:26px; width:26px; padding:6px 4px; box-shadow:none;
  }
  #t4u-qc .qc-table tbody tr:nth-child(odd) td:not(.lbl):not(.desc){background:#fffdf6}
  #t4u-qc .col-cell{min-width:160px; text-align:center}
  #t4u-qc .lbl .b-name{font-weight:700}
  #t4u-qc .badge-rider{
    display:inline-block; margin-top:5px; font-size:9px; font-weight:800; letter-spacing:.4px;
    text-transform:uppercase; background:var(--navy); color:#fff; padding:2px 7px; border-radius:5px;
  }
  #t4u-qc .row-link{color:var(--get-red); font-weight:700; text-decoration:none; display:inline-flex; align-items:center; gap:4px; justify-content:center}
  #t4u-qc.tab-hibah .row-link{color:var(--navy)}
  #t4u-qc .row-link:hover{text-decoration:underline}
  #t4u-qc .row-link svg{width:13px;height:13px}

  /* column header (name + delete) */
  #t4u-qc .col-head{display:flex; align-items:center; justify-content:center; gap:6px}
  #t4u-qc .col-head input{
    flex:1; min-width:0; border:none; border-radius:6px; padding:6px 8px; font-weight:700;
    font-size:13px; color:var(--navy); background:rgba(255,255,255,.92); text-align:center;
  }
  #t4u-qc .col-head input::placeholder{color:#9aa7b5; font-weight:500}
  #t4u-qc .col-del{
    cursor:pointer; border:none; background:rgba(255,255,255,.2); color:#fff; width:24px;height:24px;
    border-radius:6px; font-size:15px; line-height:1; flex:0 0 auto; transition:.15s;
  }
  #t4u-qc .col-del:hover{background:rgba(255,255,255,.4)}

  /* inputs inside cells */
  #t4u-qc .num,#t4u-qc .txt{
    width:100%; border:1.5px solid var(--border); border-radius:8px; padding:8px 9px; text-align:center;
    font-family:inherit; font-size:13px; color:var(--ink); background:#fff; transition:.15s;
  }
  #t4u-qc .num:focus,#t4u-qc .txt:focus,#t4u-qc .col-head input:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(250,199,72,.35)}
  #t4u-qc select.sel{
    width:100%; border:1.5px solid var(--border); border-radius:8px; padding:8px 9px; text-align:center; text-align-last:center;
    font-family:inherit; font-size:13px; color:var(--ink); background:#fff; cursor:pointer;
  }
  #t4u-qc select.sel:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(250,199,72,.35)}
  #t4u-qc .fixed-val{font-weight:600}
  #t4u-qc .pill-val{display:inline-block; background:var(--cream); border-radius:7px; padding:3px 9px; font-weight:700; font-size:12px}
  #t4u-qc .muted{color:#9aa7b5}
  #t4u-qc .opt-wrap{display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap}
  #t4u-qc .opt-wrap input[type="checkbox"]{width:18px;height:18px; accent-color:var(--get-red); cursor:pointer; flex:0 0 auto}
  #t4u-qc.tab-hibah .opt-wrap input[type="checkbox"]{accent-color:var(--navy)}
  #t4u-qc .opt-wrap .val{flex:1 1 100px; min-width:90px}
  #t4u-qc .prefix{display:flex; align-items:center; justify-content:center}
  #t4u-qc .prefix .rm{font-weight:700; color:var(--muted); padding:0 7px 0 2px; flex:0 0 auto}
  #t4u-qc .derived{font-weight:700; color:var(--navy); font-size:14px}
  #t4u-qc .hint{font-size:11px; color:var(--muted); margin-top:3px}
  #t4u-qc .warn-msg{font-size:10.5px; font-weight:700; color:var(--danger); margin-top:3px; line-height:1.3}



  #t4u-qc .qc-toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:var(--navy); color:#fff; padding:12px 18px; border-radius:11px; font-size:13px; font-weight:600;
    box-shadow:0 12px 30px rgba(0,0,0,.25); opacity:0; pointer-events:none; transition:.25s; z-index:99999; max-width:90vw;
  }
  #t4u-qc .qc-toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  #t4u-qc .qc-toast.ok{background:var(--ok)} #t4u-qc .qc-toast.err{background:var(--danger)} #t4u-qc .qc-toast.warn{background:var(--warn)}

  /* PDF mode — buka penuh description, no sticky/scroll */
  #t4u-qc.pdf .qc-scroll{overflow:visible}
  #t4u-qc.pdf .qc-table{min-width:0; font-size:11px}
  #t4u-qc.pdf .qc-table td.lbl,#t4u-qc.pdf .qc-table th.lbl,
  #t4u-qc.pdf .qc-table td.desc,#t4u-qc.pdf .qc-table th.desc{position:static; box-shadow:none}
  #t4u-qc.pdf .col-del{display:none!important}

  @media (max-width:560px){
    #t4u-qc{padding:10px 8px 50px}
    /* header stack & shrink */
    #t4u-qc .qc-brand{flex-wrap:wrap; justify-content:center; gap:4px 10px; padding:9px 10px}
    #t4u-qc .qc-logo-left{order:1}
    #t4u-qc .qc-logo-right{order:2}
    #t4u-qc .qc-head-mid{order:3; flex:1 1 100%; text-align:center; margin-top:2px}
    #t4u-qc .qc-logo img{max-height:26px}
    #t4u-qc .qc-logo-right{width:75px; height:50px; flex:0 0 75px}
    #t4u-qc .qc-logo-right img{width:100%; height:100%; object-fit:contain}
    #t4u-qc .qc-logo-left .fallback{font-size:7px; padding:3px 6px; letter-spacing:.1px}
    #t4u-qc .qc-head-mid .eyebrow{font-size:9px; letter-spacing:1px}
    #t4u-qc .qc-head-mid h1{font-size:clamp(11px,3.2vw,13px); margin-top:1px}
    /* pills — sembunyi subtitle produk */
    #t4u-qc .qc-pill small{display:none}
    #t4u-qc .qc-pill{padding:11px 10px; font-size:13px}
    /* profil customer — stack 2x2 */
    #t4u-qc .qc-profile{grid-template-columns:repeat(2,1fr); gap:8px 10px; padding:10px 12px}
    /* action bar */
    #t4u-qc .btn{flex:1 1 46%; justify-content:center}
    #t4u-qc .lang-toggle{order:-1; width:100%; display:flex; justify-content:center; align-items:center; margin-bottom:6px}

    /* ---------- JADUAL MOBILE ---------- */
    #t4u-qc .qc-table{min-width:0}

    /* Lajur "Manfaat/Benefit" — SENTIASA fixed 66px (sama tak kira 1 atau banyak lajur pelan) */
    #t4u-qc .qc-table td.lbl,#t4u-qc .qc-table th.lbl{width:66px; min-width:66px; max-width:66px; font-size:9.5px; padding:6px 5px}

    /* Kes DEFAULT (2+ lajur pelan) — kekal scrollable, desc lebar/collapsed macam biasa, col-cell min-width tetap */
    #t4u-qc .qc-table td.desc,#t4u-qc .qc-table th.desc{left:66px; min-width:160px; max-width:180px}
    #t4u-qc.desc-collapsed .qc-table td.desc,#t4u-qc.desc-collapsed .qc-table th.desc{width:18px; min-width:18px; max-width:18px}
    #t4u-qc .col-cell{min-width:104px; max-width:300px}

    /* Kes 1 LAJUR PELAN sahaja — table-layout:fixed, lajur Pelan guna calc() supaya EXACT muat
       baki ruang (bukan anggaran %), jadi tak overflow tak kira saiz skrin.
       :has() detect jika ada 4th-child td (= lajur pelan ke-2). Jika tiada, guna calc(). */
    #t4u-qc .qc-table:not(:has(td.col-cell:nth-child(4))){
      table-layout:fixed; width:100%;
    }
    /* — desc collapsed (default): lbl 66px + desc 18px, Pelan ambil baki */
    #t4u-qc.desc-collapsed .qc-table:not(:has(td.col-cell:nth-child(4))) td.desc,
    #t4u-qc.desc-collapsed .qc-table:not(:has(td.col-cell:nth-child(4))) th.desc{
      left:66px; width:18px; min-width:18px; max-width:18px; padding:6px 3px;
    }
    #t4u-qc.desc-collapsed .qc-table:not(:has(td.col-cell:nth-child(4))) td.col-cell,
    #t4u-qc.desc-collapsed .qc-table:not(:has(td.col-cell:nth-child(4))) th.col-cell{
      width:calc(100% - 84px); min-width:0; max-width:300px;
    }
    /* — desc dibuka (user tekan "+"): desc lebih lebar, Pelan tolak ikut baki sebenar */
    #t4u-qc:not(.desc-collapsed) .qc-table:not(:has(td.col-cell:nth-child(4))) td.desc,
    #t4u-qc:not(.desc-collapsed) .qc-table:not(:has(td.col-cell:nth-child(4))) th.desc{
      left:66px; width:140px; min-width:140px; max-width:140px;
    }
    #t4u-qc:not(.desc-collapsed) .qc-table:not(:has(td.col-cell:nth-child(4))) td.col-cell,
    #t4u-qc:not(.desc-collapsed) .qc-table:not(:has(td.col-cell:nth-child(4))) th.col-cell{
      width:calc(100% - 206px); min-width:0; max-width:300px;
    }
    /* pastikan value panjang break ke baris baru, tak overflow/cut-off */
    #t4u-qc .qc-table:not(:has(td.col-cell:nth-child(4))) td.col-cell,
    #t4u-qc .qc-table:not(:has(td.col-cell:nth-child(4))) th.col-cell{
      white-space:normal; word-break:break-word; overflow-wrap:anywhere;
    }
    #t4u-qc .qc-table:not(:has(td.col-cell:nth-child(4))) .col-head input{
      min-width:0;
    }

    #t4u-qc .badge-rider{font-size:7.5px; padding:1px 4px; margin-top:3px}
  }
  </style>

  <!-- HEADER -->
  <div class="qc-brand" id="qc-brand">
    <div class="qc-logo qc-logo-left" id="logoLeft"></div>
    <div class="qc-head-mid">
      <div class="eyebrow" id="qcEyebrow">Kad Medikal</div>
      <h1 id="qcTitle">Quotation Kad Medikal — i-Medi Evolusi</h1>
    </div>
    <div class="qc-logo qc-logo-right" id="logoRight"></div>
  </div>

  <!-- PILLS -->
  <div class="qc-pills">
    <button class="qc-pill active" data-tab="medical"><span class="dot"></span><span id="pillMedTxt">Kad Medikal</span> <small id="pillMedSub">i-Medi Evolusi</small></button>
    <button class="qc-pill" data-tab="hibah"><span class="dot"></span><span id="pillHibTxt">Hibah</span> <small id="pillHibSub">i-Great Nova &amp; Chinta</small></button>
  </div>

  <!-- PROFIL CUSTOMER -->
  <div class="qc-profile" id="qcProfile">
    <div class="qc-pfield">
      <label for="pfName" id="lblName">Nama</label>
      <input type="text" id="pfName" placeholder="cth Muhammad Danial Bin Abdul Rahman">
    </div>
    <div class="qc-pfield">
      <label for="pfDob" id="lblDob">Tarikh Lahir</label>
      <input type="date" id="pfDob">
    </div>
    <div class="qc-pfield age">
      <label for="pfAge" id="lblAge">ANB (auto)</label>
      <input type="text" id="pfAge" readonly placeholder="—">
    </div>
    <div class="qc-pfield">
      <label for="pfPhone" id="lblPhone">Nombor Telefon</label>
      <input type="tel" id="pfPhone" placeholder="cth 011-63030513">
    </div>
  </div>

  <!-- TABLE AREA -->
  <div class="qc-export" id="qcExport">
    <div class="qc-scroll">
      <table class="qc-table"></table>
    </div>
  </div>

  <!-- ACTION BAR (bawah) -->
  <div class="qc-toolbar">
    <div class="lang-toggle" id="langToggle">
      <button class="lang-btn active" data-lang="bm">BM</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
    <button class="btn btn-add" id="btnAdd">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span id="btnAddTxt">Tambah Column</span>
    </button>
    <span class="sp" style="flex:1"></span>

  // cell builders — checkbox kiri, kotak nilai di kanan (inline)
  function optWaiver(c){ return `<div class="opt-wrap"><input type="checkbox" data-col="${c.id}" data-field="waiver" ${c.waiver?'checked':''} title="${L('Sertakan','Include')}"><span class="${c.waiver?'fixed-val':'muted'}">${c.waiver?L('Ya','Yes'):'—'}</span></div>`; }
  const WARN_MIN = () => L('⚠️ nilai wajib RM100,000 ke atas','⚠️ value must be RM100,000 or above');
  const WARN_RANGE = (mn,mx) => L(`⚠️ nilai wajib antara ${fmtI(mn)} – ${fmtI(mx)}`,`⚠️ value must be between ${fmtI(mn)} – ${fmtI(mx)}`);
  function optAmt(c,key,min,step,tag,max){
    const on=c[key+'_on'];
    const amtVal = c[key+'_amt']!=null ? num(c[key+'_amt']) : min;
    const showWarn = on && (max ? (amtVal<min || amtVal>max) : amtVal<100000);
    const hint = max ? `${L('Min','Min')} ${fmtI(min)} · ${L('Maks','Max')} ${fmtI(max)}` : `${L('Min','Min')} ${fmtI(min)}`;
    const warnTxt = max ? WARN_RANGE(min,max) : WARN_MIN();
    return `<div class="opt-wrap"><input type="checkbox" data-col="${c.id}" data-field="${key}_on" ${on?'checked':''} title="${L('Sertakan','Include')}">`
      + (on
        ? `<div class="prefix val"><span class="rm">RM</span><input class="num" type="number" min="${min}" ${max?`max="${max}"`:''} step="${step}" data-col="${c.id}" data-field="${key}_amt" value="${c[key+'_amt']!=null?c[key+'_amt']:min}"></div></div><div class="hint">${hint}</div><div class="warn-msg" id="warn-${tag}-${c.id}" style="display:${showWarn?'block':'none'}">${warnTxt}</div>`
        : `<span class="muted">—</span></div>`);
  }
  function optAllow(c){
    const on=c.allow_on;
    return `<div class="opt-wrap"><input type="checkbox" data-col="${c.id}" data-field="allow_on" ${on?'checked':''} title="${L('Sertakan','Include')}">`
      + (on
        ? `<input class="txt val" type="text" data-col="${c.id}" data-field="allow_txt" value="${esc(c.allow_txt!=null?c.allow_txt:'RM100/hari (Gov & Swasta)')}"></div>`
        : `<span class="muted">—</span></div>`);
  }

    {key:'contribType', label:{bm:'Type of Contribution',en:'Type of Contribution'}, def:D.contribType, cell:()=>`<span class="fixed-val">Level</span>`},
    {key:'cashM', label:{bm:'Cash Value / Savings',en:'Cash Value / Savings'}, def:D.cashM, cell:c=>optCash(c,L('Anggaran selepas 10 tahun','Estimate after 10 years'))},
    {key:'gj', label:{bm:'Great Journey Rule',en:'Great Journey Rule'}, def:D.gj, cell:()=>`<span>${L('Ya','Yes')} <span class="muted">${L('(klinik dahulu)','(clinic first)')}</span></span>`},
    {key:'days', label:{bm:'Days in Hospital + ICU',en:'Days in Hospital + ICU'}, def:D.days, cell:()=>`<span class="fixed-val">${L('Unlimited (365 hari)','Unlimited (365 days)')}</span>`},
    {key:'waiting', label:{bm:'Waiting Period',en:'Waiting Period'}, def:D.waiting, cell:()=>`<span>${L('30 hari · 120 hari · 2 tahun','30 days · 120 days · 2 years')}</span><br>${linkCell(CONFIG.PORTAL_MEDICAL_URL, L('Buka Portal','Open Portal'))}`},
    {key:'panel', label:{bm:'Lists of Hospitals (Panel)',en:'Lists of Hospitals (Panel)'}, def:D.panel, cell:()=>linkCell(CONFIG.PANEL_LOCATOR_URL, L('85 hospital — Panel Locator','85 hospitals — Panel Locator'))},
    {key:'portalM', label:{bm:'Client Portal',en:'Client Portal'}, def:D.portalM, cell:()=>linkCell(CONFIG.PORTAL_MEDICAL_URL, L('Buka Portal','Open Portal'))},
    {key:'remarkM', label:{bm:'Remarks (Tax)',en:'Remarks (Tax)'}, def:D.remarkM, cell:()=>`<span class="muted">${L('Tax claimable RM4,000 (swasta) / RM7,000 (gov)','Tax claimable RM4,000 (private) / RM7,000 (gov)')}</span>`},
    {key:'yearly', label:{bm:'Caruman Tahunan',en:'Yearly Contribution'}, def:D.yearly, cell:c=>`<div class="prefix"><span class="rm">RM</span><input class="num" type="number" min="0" step="0.01" placeholder="${L('cth','e.g.')} 2769.60" data-col="${c.id}" data-field="yearly" value="${c.yearly!=null?c.yearly:''}"></div>`},

    {key:'haji', label:{bm:'Manfaat Kematian Haji & Umrah',en:'Death Benefit during Haj & Umrah'}, def:D.haji, cell:c=>`<span class="derived" id="der-haji-hibah-${c.id}">${fmtI(num(c.sumCovered)*2)}</span><div class="hint">${L('auto 2× pampasan asas','auto 2× basic benefit')}</div>`},

    {key:'ageH', label:{bm:'Coverage Until Age',en:'Coverage Until Age'}, def:D.ageH, cell:c=>`<select class="sel" data-col="${c.id}" data-field="ageH"><option value="60" ${c.ageH==='60'?'selected':''}>60</option><option value="70" ${c.ageH==='70'?'selected':''}>70</option><option value="80" ${c.ageH==='80'?'selected':''}>80</option></select>`},

    {key:'ciH', label:{bm:'Critical Illness Benefit',en:'Critical Illness Benefit'}, def:D.ciH, cell:c=>optAmt(c,'ci',100000,1000,'ci-hibah'), badge:true},

    {key:'yearly', label:{bm:'Caruman Tahunan',en:'Yearly Contribution'}, def:D.yearly, cell:c=>`<div class="prefix"><span class="rm">RM</span><input class="num" type="number" min="0" step="0.01" placeholder="${L('cth','e.g.')} 1132.20" data-col="${c.id}" data-field="yearly" value="${c.yearly!=null?c.yearly:''}"></div>`},
    {key:'monthly', label:{bm:'Caruman Bulanan',en:'Monthly Contribution'}, cell:c=>`<span class="derived" id="der-monthly-hibah-${c.id}">${fmt(num(c.yearly)/12)}</span>`}
  ];

  const ROWS = { medical:MEDICAL, hibah:HIBAH };

  /* ---------- STATE ---------- */
  function newMed(){ return { id:++uid, name:'', ageM:'70', rnb:'150', yearly:'', cash_on:false, cash_amt:'', allow_on:false, allow_txt:'', ci_on:false, ci_amt:10000, waiver:false }; }
  function newHib(){ return { id:++uid, name:'', ageH:'60', plan:'nova', sumCovered:'', yearly:'', cash_on:false, cash_amt:'', ci_on:false, ci_amt:100000, adb_on:false, adb_amt:100000, waiver:false }; }
  state.medical = { columns:[ newMed(), newMed() ] };
  state.hibah   = { columns:[ newHib(), newHib() ] };

  function calcANB(dobStr){
    if(!dobStr) return '';
    const d=new Date(dobStr); if(isNaN(d)) return '';
    const t=new Date(); let a=t.getFullYear()-d.getFullYear();
    const m=t.getMonth()-d.getMonth();
    if(m<0 || (m===0 && t.getDate()<d.getDate())) a--;
    a = a + 1; // ANB = Age Next Birthday
    return a>=0 && a<131 ? String(a) : '';
  }

  /* ---------- RENDER ---------- */
  function render(){
    const tab = state.active;
    const cols = state[tab].columns;
    const rows = ROWS[tab]();

    let html = '';
    // header
    html += `<thead><tr><th class="lbl">${UI[state.lang].thBenefit}</th>`
          + `<th class="desc" id="descHeadCell">${state.descOpen
              ? `<div class="desc-head"><span>${UI[state.lang].thDesc}</span><span class="desc-ic">−</span></div>`
              : `<div class="desc-head"><span class="desc-ic">+</span></div>`}</th>`;
    cols.forEach(c=>{
      html += `<th class="col-cell"><div class="col-head"><input type="text" placeholder="${UI[state.lang].colPh} ${cols.indexOf(c)+1}" data-col="${c.id}" data-field="name" value="${esc(c.name)}">`
            + (cols.length>1?`<button class="col-del" title="×" data-del="${c.id}">×</button>`:'')
            + '</div></th>';
    });
    html += '</tr></thead><tbody>';

    rows.forEach(r=>{
      html += '<tr>';
      const badge = r.badge ? `<span class="badge-rider">${UI[state.lang].badgeRider}</span>` : '';
      html += `<td class="lbl"><span class="b-name">${tr(r.label)}</span>${badge}</td>`;
      html += `<td class="desc">${(state.descOpen && r.def) ? tr(r.def) : ''}</td>`;
      cols.forEach(c=>{ html += `<td class="col-cell">${r.cell(c)}</td>`; });
      html += '</tr>';
    });

    html += '</tbody>';
    TABLE.innerHTML = html;   // html mengandungi <thead>…</thead><tbody>…
    updateHeaderChrome();
    recalc();
  }

  function updateHeaderChrome(){
    const tab = state.active;
    root.className = 'tab-'+tab + (state.descOpen ? '' : ' desc-collapsed');
    const t = UI[state.lang];
    setT('qcEyebrow', tab==='medical' ? t.eyebrowMedical : t.eyebrowHibah);
    setT('qcTitle', tab==='medical' ? t.titleMedical : t.titleHibah);
    setT('pillMedTxt', t.pillMed); setT('pillHibTxt', t.pillHib);
    setT('lblName', t.profName); setT('lblDob', t.profDob); setT('lblAge', t.profAge); setT('lblPhone', t.profPhone);
    setT('btnAddTxt', t.btnAdd); setT('btnPdfTxt', t.btnPdf); setT('btnJpegTxt', t.btnJpeg); setT('btnWaTxt', t.btnWa); setT('btnSaveTxt', t.btnSave);
    // logos
    document.getElementById('logoRight').innerHTML = CONFIG.LOGO_GREAT_EASTERN
      ? `<img src="${CONFIG.LOGO_GREAT_EASTERN}" alt="Great Eastern Takaful" crossorigin="anonymous">`
      : `<span class="fallback">Great Eastern Takaful</span>`;
    document.getElementById('logoLeft').innerHTML = CONFIG.LOGO_GREAT_JOURNEY
      ? `<img src="${CONFIG.LOGO_GREAT_JOURNEY}" alt="The Great Journey" crossorigin="anonymous">`
      : `<span class="fallback">The Great Journey</span>`;
  }

  function recalc(){
    const tab = state.active;
    const cols = state[tab].columns;
    cols.forEach(c=>{
      const y = num(c.yearly), m = y/12;
      setT(`der-monthly-${tab}-${c.id}`, fmt(m));
      if(tab==='hibah'){
        setT(`der-haji-hibah-${c.id}`, fmtI(num(c.sumCovered)*2));
        setT(`der-khairat-hibah-${c.id}`, c.plan==='chinta'?'RM5,000':'RM2,000');
        setShow(`warn-ci-hibah-${c.id}`, c.ci_on && num(c.ci_amt) < 100000);
        setShow(`warn-adb-hibah-${c.id}`, c.adb_on && num(c.adb_amt) < 100000);
      } else {
        setT(`der-limit-medical-${c.id}`, c.rnb==='200'?fmtI(2000000):fmtI(1500000));
        setShow(`warn-ci-medical-${c.id}`, c.ci_on && (num(c.ci_amt) < 10000 || num(c.ci_amt) > 30000));
      }
    });
  }

  /* ---------- EVENTS ---------- */
  // pills
  document.querySelectorAll('#t4u-qc .qc-pill').forEach(p=>{
    p.addEventListener('click',()=>{
      document.querySelectorAll('#t4u-qc .qc-pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      state.active = p.dataset.tab;
      render();
    });
  });

  // language toggle
  document.querySelectorAll('#t4u-qc .lang-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(b.classList.contains('active')) return;
      document.querySelectorAll('#t4u-qc .lang-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      state.lang = b.dataset.lang;
      render();
    });
  });

  // typing (no re-render) — text & number inputs
  TABLE.addEventListener('input', e=>{
    const t=e.target; if(!t.matches('input[type="number"],input[type="text"]')) return;
    const id=+t.dataset.col, field=t.dataset.field; if(!field) return;
    const col=state[state.active].columns.find(c=>c.id===id); if(!col) return;
    col[field]=t.value;
    recalc();
  });

  // change (re-render) — selects & checkboxes
  TABLE.addEventListener('change', e=>{
    const t=e.target; if(!t.matches('select, input[type="checkbox"]')) return;
    const id=+t.dataset.col, field=t.dataset.field; if(!field) return;
    const col=state[state.active].columns.find(c=>c.id===id); if(!col) return;
    col[field] = (t.type==='checkbox') ? t.checked : t.value;
    render();
  });

  // clicks — toggle lajur description + delete column
  TABLE.addEventListener('click', e=>{
    const descHead=e.target.closest('th.desc');
    if(descHead){ state.descOpen=!state.descOpen; render(); return; }
    const del=e.target.closest('.col-del');
    if(del){ const id=+del.dataset.del; const cols=state[state.active].columns;
      if(cols.length>1){ state[state.active].columns = cols.filter(c=>c.id!==id); render(); } }
  });

  // add column
  document.getElementById('btnAdd').addEventListener('click',()=>{
    state[state.active].columns.push(state.active==='medical'?newMed():newHib());

    const sc=document.querySelector('#t4u-qc .qc-scroll'); sc.scrollLeft=sc.scrollWidth;

  /* ---------- PAYLOAD / EXPORT ---------- */
  function buildPayload(){
    const tab=state.active;
    return {
      type: tab==='medical'?'Kad Medikal (i-Medi Evolusi)':'Hibah (i-Great Nova/Chinta)',
      tab, lang:state.lang, created_at:new Date().toISOString(),
      agent:CONFIG.AGENT_NAME, site:CONFIG.SITE_URL,
      customer:{ name:state.profile.name||'', dob:state.profile.dob||'', anb:calcANB(state.profile.dob), phone:state.profile.phone||'' },
      columns: state[tab].columns.map(c=>{
        const o={ name:c.name||'', yearly_contribution:num(c.yearly), monthly_contribution:Math.round(num(c.yearly)/12*100)/100 };
        if(tab==='medical'){ o.coverage_age=c.ageM; o.room_board='RM'+c.rnb; o.overall_medical_limit=c.rnb==='200'?2000000:1500000;
          o.cash_value=c.cash_on?(num(c.cash_amt)||true):false; o.daily_allowance=c.allow_on?(c.allow_txt||'RM100/hari'):false;
          o.critical_illness=c.ci_on?num(c.ci_amt):false; o.payment_waiver=!!c.waiver; }
        else { o.plan=c.plan==='chinta'?'i-Great Chinta':'i-Great Nova'; o.coverage_age=c.ageH; o.basic_sum_covered=num(c.sumCovered);
          o.khairat_kematian=c.plan==='chinta'?5000:2000; o.haji_umrah=num(c.sumCovered)*2;
          o.cash_value=c.cash_on?(num(c.cash_amt)||true):false; o.critical_illness=c.ci_on?num(c.ci_amt):false;
          o.accidental_benefit=c.adb_on?num(c.adb_amt):false; o.payment_waiver=!!c.waiver; }
        return o;
      })
    };
  }

  function waText(){
    const p=buildPayload(); let lines=[`*${state.lang==='en'?'Quotation':'Quotation'} ${p.type}*`, ''];
    if(p.customer.name) lines.push(`*${L('Nama','Name')}:* ${p.customer.name}`);
    if(p.customer.anb) lines.push(`*ANB:* ${p.customer.anb}`);
    if(p.customer.name||p.customer.anb) lines.push('');
    p.columns.forEach((c,i)=>{
      lines.push(`*${c.name||(L('Pelan','Plan')+' '+(i+1))}*`);
      if(p.tab==='hibah'){ lines.push(`• ${L('Pelan','Plan')}: ${c.plan}`); lines.push(`• ${L('Pampasan Hibah','Hibah Benefit')}: ${fmtI(c.basic_sum_covered)}`); lines.push(`• ${L('Khairat','Compassionate')}: ${fmtI(c.khairat_kematian)}`); lines.push(`• Haji/Umrah: ${fmtI(c.haji_umrah)}`); if(c.critical_illness)lines.push(`• ${L('Penyakit Kritikal','Critical Illness')}: ${fmtI(c.critical_illness)}`); if(c.accidental_benefit)lines.push(`• Accidental: ${fmtI(c.accidental_benefit)}`); if(c.payment_waiver)lines.push(`• Payment Waiver: ${L('Ya','Yes')}`); }
      else { lines.push(`• R&B: ${c.room_board}/${L('hari','day')}`); lines.push(`• ${L('Had Perlindungan','Coverage Age')}: ${c.coverage_age}`); lines.push(`• Medical Limit: ${fmtI(c.overall_medical_limit)}/${L('thn','yr')}`); if(c.critical_illness)lines.push(`• ${L('Penyakit Kritikal','Critical Illness')}: ${fmtI(c.critical_illness)}`); if(c.daily_allowance)lines.push(`• ${L('Elaun Hospital','Daily Allowance')}: ${c.daily_allowance}`); if(c.payment_waiver)lines.push(`• Payment Waiver: ${L('Ya','Yes')}`); }
      lines.push(`• ${L('Caruman','Contribution')}: ${fmt(c.yearly_contribution)}/${L('thn','yr')} (${fmt(c.monthly_contribution)}/${L('bln','mo')})`); lines.push('');
    });
    lines.push(`${L('Dapatkan quotation penuh & konsultasi PERCUMA di','Get your full quotation & FREE consultation at')} ${CONFIG.SITE_URL}`);
    return lines.join('\n');
  }

  // SAVE -> CRM (capture-quotation). Falls back to the original Pabbly
  // webhook only when this isn't opened against a lead.
  document.getElementById('btnSave').addEventListener('click', async ()=>{
    if(CRM.leadId){ return CRM.save(); }
    const t=UI[state.lang];
    if(!CONFIG.PABBLY_WEBHOOK_URL){ showToast(t.toastSaveNeed,'warn'); return; }
    const payload=buildPayload();
    showToast(t.toastSaving);
    try{
      await fetch(CONFIG.PABBLY_WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      showToast(t.toastSaveOk,'ok');
    }catch(err){
      try{ await fetch(CONFIG.PABBLY_WEBHOOK_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
        showToast(t.toastSaveOk2,'ok'); }
      catch(e2){ showToast(t.toastSaveErr+e2.message,'err'); }
    }
  });

  /* =================== EKSPORT PDF / JPEG / WHATSAPP =================== */
  let pdfLoading=false;
  function ensureLibs(){
    return new Promise((res,rej)=>{
      if(window.html2pdf && window.html2canvas) return res();
      if(pdfLoading){ const i=setInterval(()=>{ if(window.html2pdf && window.html2canvas){clearInterval(i);res();} },120); return; }
      pdfLoading=true; const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
      s.onload=res; s.onerror=()=>rej(new Error('load fail')); document.head.appendChild(s);
    });
  }

  // Tangkap KESELURUHAN halaman (#t4u-qc penuh: header, pill, profil, jadual, butang)
  // secara live guna html2canvas. Kelas .pdf dipasang sementara utk buka sticky/scroll
  // supaya jadual penuh kelihatan (tiada bahagian tersembunyi).
  async function captureCanvas(){
    await ensureLibs();
    root.classList.add('pdf');            // matikan sticky/scroll utk tangkapan bersih
    const prevW=root.style.width;
    try{
      // pastikan lebar cukup utk jadual penuh (jika jadual lebih lebar dari container)
      const tbl=root.querySelector('table.qc-table');
      const needW=Math.max(root.scrollWidth, (tbl?tbl.scrollWidth:0)+40);
      root.style.width=needW+'px';
      // beri masa font/img/layout settle dulu
      if(document.fonts && document.fonts.ready) { try{ await document.fonts.ready; }catch(e){} }
      await new Promise(r=>setTimeout(r,80));
      const canvas=await window.html2canvas(root, {scale:2, useCORS:true, backgroundColor:'#fbf4e4', windowWidth:needW, scrollX:0, scrollY:0,
        ignoreElements: el => el.classList && el.classList.contains('qc-toast')});
      return canvas;
    } finally {
      root.style.width=prevW;
      root.classList.remove('pdf');
    }
  }

  // Bina PDF (A4 landscape) drpd canvas — pecah ke banyak page jika panjang
  function canvasToPdf(canvas){
    const jsPDFctor = (window.jspdf && window.jspdf.jsPDF) ? window.jspdf.jsPDF : window.jsPDF;
    const pdf=new jsPDFctor({unit:'mm', format:'a4', orientation:'landscape'});
    const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
    const margin=8, availW=pw-margin*2, availH=ph-margin*2;
    const imgW=availW, imgH=canvas.height*(availW/canvas.width);
    const img=canvas.toDataURL('image/jpeg',0.95);
    if(imgH<=availH){
      pdf.addImage(img,'JPEG',margin,margin,imgW,imgH);
    } else {
      // pecah page: hirisan mengikut ketinggian
      let remaining=imgH, pos=margin;
      let page=0;
      const pxPerMm=canvas.width/imgW;
      const sliceHpx=availH*pxPerMm;
      let sy=0;
      while(sy<canvas.height){
        const c2=document.createElement('canvas');
        c2.width=canvas.width; c2.height=Math.min(sliceHpx, canvas.height-sy);
        c2.getContext('2d').drawImage(canvas,0,sy,canvas.width,c2.height,0,0,canvas.width,c2.height);
        const sliceImg=c2.toDataURL('image/jpeg',0.95);
        const sliceHmm=c2.height/pxPerMm;
        if(page>0) pdf.addPage();
        pdf.addImage(sliceImg,'JPEG',margin,margin,imgW,sliceHmm);
        sy+=c2.height; page++;
      }
    }
    return pdf;
  }

  const nameSafe=()=> state.active==='medical'?'Kad-Medikal':'Hibah';
  const fileStamp=()=> nameSafe()+'-'+Date.now();

  // ---- DOWNLOAD PDF ----
  document.getElementById('btnPdf').addEventListener('click', async ()=>{
    const t=UI[state.lang];
    showToast(t.toastPdfPrep);
    try{
      const canvas=await captureCanvas();
      const pdf=canvasToPdf(canvas);
      pdf.save(`Quotation-${fileStamp()}.pdf`);
      showToast(t.toastPdfOk,'ok');
    }catch(err){ showToast(UI[state.lang].toastPdfErr+(err&&err.message?err.message:''),'err'); }
  });

  // ---- DOWNLOAD JPEG ----
  document.getElementById('btnJpeg').addEventListener('click', async ()=>{
    showToast(L('Menyediakan JPEG…','Preparing JPEG…'));
    try{
      const canvas=await captureCanvas();
      const link=document.createElement('a');
      link.download=`Quotation-${fileStamp()}.jpg`;
      link.href=canvas.toDataURL('image/jpeg',0.95);
      document.body.appendChild(link); link.click(); link.remove();
      showToast(L('JPEG berjaya dimuat turun ✅','JPEG downloaded successfully ✅'),'ok');
    }catch(err){ showToast(L('Ralat JPEG: ','JPEG error: ')+(err&&err.message?err.message:''),'err'); }
  });

  // Normalkan nombor telefon MY ke format wa.me (cth 0116303... -> 60116303...)
  // Normalkan nombor telefon ke format Malaysia +60 (E.164).
  // Terima apa saja input: "011-6303 0513", "+6011...", "601163..." → output digit "6011..."
  // (wa.me guna digit tanpa tanda "+", tapi ini tetap nombor +60 yang sama)
  function waNumber(){
    let d=String(state.profile.phone||'').replace(/\D/g,'');
    if(!d) return '';
    if(d.startsWith('600')) d='60'+d.slice(3);       // user taip +60 011... (lebihan 0)
    else if(d.startsWith('0')) d='60'+d.slice(1);    // 011... -> 6011...
    else if(!d.startsWith('60')) d='60'+d;           // 11... -> 6011...
    return d;
  }

  // ---- HANTAR WHATSAPP (hantar fail PDF) ----
  document.getElementById('btnWa').addEventListener('click', async ()=>{
    const textMsg=waText();
    const numDigits=waNumber();
    showToast(L('Menyediakan PDF untuk WhatsApp…','Preparing PDF for WhatsApp…'));
    try{
      const canvas=await captureCanvas();
      const pdf=canvasToPdf(canvas);
      const blob=pdf.output('blob');
      const filename=`Quotation-${fileStamp()}.pdf`;
      const file=new File([blob],filename,{type:'application/pdf'});

      // Cara terbaik hantar FAIL: Web Share API (mobile) — buka share sheet, user pilih chat WhatsApp
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({ files:[file], title:'Quotation '+nameSafe(), text:textMsg });
        showToast(L('Kongsi berjaya ✅','Shared successfully ✅'),'ok');
        return;
      }

      // Fallback (desktop / browser tak sokong share fail):
      // muat turun PDF + buka chat WhatsApp (guna nombor telefon jika terisi) dgn teks ringkasan.
      const dlUrl=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=dlUrl; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(dlUrl),5000);
      const waUrl = numDigits
        ? 'https://wa.me/'+numDigits+'?text='+encodeURIComponent(textMsg)
        : 'https://wa.me/?text='+encodeURIComponent(textMsg);
      window.open(waUrl,'_blank');
      showToast(
        numDigits
          ? L('PDF dimuat turun & chat WhatsApp dibuka ke nombor pelanggan — lampirkan PDF tersebut.','PDF downloaded & WhatsApp chat opened to the customer number — attach the PDF.')
          : L('PDF dimuat turun — sila lampirkan secara manual di WhatsApp.','PDF downloaded — attach it manually in WhatsApp.'),
        'ok'
      );
    }catch(err){
      if(err && err.name==='AbortError'){ /* user batal share sheet */ }
      else showToast(L('Ralat kongsi: ','Share error: ')+(err&&err.message?err.message:''),'err');
    }
  });

  /* ---------- CRM INTEGRATION ---------- */
  const CRM = (function(){
    const q = new URLSearchParams(location.search);
    const leadId = q.get('lead_id') || '';
    const quotationId = q.get('quotation_id') || '';
    let savedId = null;

    function post(msg){ try{ if(window.parent!==window) window.parent.postMessage(msg,'*'); }catch(e){} }

    // Prefill the customer card from the lead the CRM opened this for.
    function prefill(){
      const name = q.get('name'), dob = q.get('dob'), phone = q.get('phone');
      if(name){ state.profile.name = name; pfName.value = name; }
      if(phone){ state.profile.phone = phone; pfPhone.value = phone; }
      if(dob){ state.profile.dob = dob; pfDob.value = dob; pfAge.value = calcANB(dob); }
    }

    // Reopening a saved quotation: restore the exact columns/tab/language it
    // was saved with so it can be reviewed and edited, not just re-created.
    async function restore(){
      if(!quotationId) return;
      try{
        const res = await fetch('/api/quotations/' + quotationId, { headers:{ 'Accept':'application/json' } });
        if(!res.ok) throw new Error('HTTP ' + res.status);
        const { raw_payload: p } = await res.json();
        if(!p || !p.__customizer) return;
        state.active = p.tab === 'hibah' ? 'hibah' : 'medical';
        state.lang = p.lang === 'en' ? 'en' : 'bm';
        if(p.customer){
          state.profile.name = p.customer.name || '';
          state.profile.phone = p.customer.phone || '';
          state.profile.dob = p.customer.dob || '';
          pfName.value = state.profile.name;
          pfPhone.value = state.profile.phone;
          pfDob.value = state.profile.dob;
          pfAge.value = calcANB(state.profile.dob);
        }
        if(Array.isArray(p.__columns) && p.__columns.length){
          state[state.active].columns = p.__columns;
        }
        document.querySelectorAll('#t4u-qc .qc-pill').forEach(x=>{
          x.classList.toggle('active', x.dataset.tab === state.active);
        });
        document.getElementById('t4u-qc').className = 'tab-' + state.active;
        render();
        showToast(L('Quotation dimuatkan untuk disunting.','Quotation loaded for editing.'),'ok');
      }catch(err){
        showToast(L('Gagal muat quotation tersimpan.','Could not load the saved quotation.'),'err');
      }
    }

    async function save(){
      const p = buildPayload();
      const tab = p.tab;
      // The customizer spans both product families; map onto the existing
      // quotation_product enum rather than widening it.
      const product = tab === 'hibah' ? 'hibah_mixed' : 'imedi_evolusi';
      // A blank column is one the agent hasn't filled in yet, not a real
      // option -- saving it would put RM0 plans on the lead and drag down the
      // pipeline/statistics figures that average over plans.
      const cols = p.columns.filter(c => (c.yearly_contribution || 0) > 0);
      if(!cols.length){
        showToast(L('Isi caruman tahunan sekurang-kurangnya satu pelan dahulu.','Enter a yearly contribution for at least one plan first.'),'warn');
        return;
      }
      const plans = cols.map((c,i)=>({
        sort_order: i,
        plan_label: c.name || ((tab==='hibah' ? 'Hibah' : 'Medical') + ' Option ' + (i+1)),
        monthly_contribution: c.monthly_contribution || 0,
        annual_contribution: c.yearly_contribution || 0,
        coverage_detail: c
      }));

      showToast(L('Menyimpan ke lead…','Saving to lead…'));
      try{
        const res = await fetch(CONFIG.CAPTURE_QUOTATION_URL, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            lead_id: leadId, product, language: state.lang,
            // __customizer/__columns let restore() rebuild the editor exactly;
            // the rest stays human-readable for anything else reading it.
            raw_payload: Object.assign({}, p, { __customizer:true, __columns: state[tab].columns }),
            plans
          })
        });
        const json = await res.json().catch(()=>null);
        if(!res.ok || !json || !json.quotation_id) throw new Error((json&&json.error)||('HTTP '+res.status));
        savedId = json.quotation_id;
        showToast(L('Disimpan ke lead.','Saved to lead.'),'ok');
        post({ type:'t4u-quotation-saved', quotation_id: savedId });
      }catch(err){
        showToast(L('Gagal simpan: ','Save failed: ') + (err&&err.message?err.message:''),'err');
      }
    }

    return { leadId, quotationId, prefill, restore, save };
  })();

  /* ---------- INIT ---------- */
  render();
  CRM.prefill();
  CRM.restore();
})();
</script>
