    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';

    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin

    // an origin exists), and both directions are origin-gated (on https

      // and sender identity (own child frame / direct parent) is checked
      // separately.

      el.src = u + frag;

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.

        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

          blobUrls[uuid] = URL.createObjectURL(blob);

        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

d #ecdfc4; border-radius: 16px; padding: 0 16px;\">\n          <summary style=\"min-height: 52px; display: flex; align-items: center; gap: 8px; cursor: pointer;\"><span style=\"font-weight: 700; font-size: 15px; color: #0f2540;\">▾ {{g.name}}<\u002Fspan><span style=\"font-size: 12px; font-weight: 700; color: #1d4f91; background: #e6eef9; border-radius: 9999px; padding: 2px 8px;\">{{g.count}}<\u002Fspan><\u002Fsummary>\n          <ul style=\"margin: 0; padding: 0; list-style: none; border-top: 1px solid #ecdfc4;\">\n            <sc-for list=\"{{g.items}}\" as=\"o\" hint-placeholder-count=\"4\">\n              <li style=\"border-bottom: 1px solid #ecdfc4;\">\n                <button type=\"button\" sc-camel-on-click=\"{{o.toggle}}\" aria-expanded=\"{{o.expandedStr}}\" style=\"width: 100%; min-height: 50px; display: flex; align-items: center; justify-content: space-between; border: 0; background: transparent; font-size: 14px; font-weight: 500; color: #1c2433; cursor: pointer; text-align: left; padding: 0;\">“{{o.q}}”<span aria-hidden=\"true\" style=\"color: #1d4f91; font-size: 18px; font-weight: 700; padding: 0 6px;\">{{o.sign}}<\u002Fspan><\u002Fbutton>\n                <sc-if value=\"{{o.open}}\" hint-placeholder-val=\"{{false}}\">\n                  <div style=\"display: flex; flex-direction: column; gap: 10px; padding-bottom: 12px;\">\n                    <sc-if value=\"{{o.view}}\" hint-placeholder-val=\"{{true}}\"><p style=\"margin: 0; font-size: 13px; line-height: 1.7; color: #3d4757;\">{{o.a}}<\u002Fp><\u002Fsc-if>\n                    <sc-if value=\"{{o.editing}}\" hint-placeholder-val=\"{{false}}\"><label for=\"{{o.id}}\" style=\"font-size: 12px; font-weight: 600;\">Your answer<\u002Flabel><textarea id=\"{{o.id}}\" rows=\"3\" value=\"{{o.a}}\" sc-camel-on-change=\"{{o.set}}\" style=\"border: 1.5px solid #fac748; border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.6; background: #fffbf0; resize: vertical;\"><\u002Ftextarea><\u002Fsc-if>\n                    <button type=\"button\" sc-camel-on-click=\"{{o.mark}}\" aria-pressed=\"{{o.markedStr}}\" style=\"{{o.markStyle}}\">{{o.markLabel}}<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fli>\n            <\u002Fsc-for>\n          <\u002Ful>\n        <\u002Fdetails>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background: #ffffff; border: 1px solid #e3dccd; border-radius: 16px; padding: 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px;\">\n    <div style=\"flex: 1 1 320px; display: flex; flex-direction: column; gap: 4px;\">\n      <span style=\"font-weight: 700; font-size: 16px; color: #0f2540;\">Record the outcome · {{raisedCount}} objections logged<\u002Fspan>\n      <span style=\"font-size: 13px; color: #5b6576;\">Updates the lead stage and sets the next follow-up in Tasks.<\u002Fspan>\n    <\u002Fdiv>\n    <button type=\"button\" style=\"min-height: 48px; padding: 0 18px; border: 0; border-radius: 10px; background: #fac748; color: #0f2540; font-size: 14px; font-weight: 700; cursor: pointer;\">Ready for quote<\u002Fbutton>\n    <button type=\"button\" style=\"min-height: 48px; padding: 0 18px; border: 1px solid #0f2540; border-radius: 10px; background: #ffffff; color: #0f2540; font-size: 14px; font-weight: 600; cursor: pointer;\">Needs spouse discussion<\u002Fbutton>\n    <button type=\"button\" style=\"min-height: 48px; padding: 0 18px; border: 1px solid #0f2540; border-radius: 10px; background: #ffffff; color: #0f2540; font-size: 14px; font-weight: 600; cursor: pointer;\">Follow up later<\u002Fbutton>\n    <button type=\"button\" style=\"min-height: 48px; padding: 0 18px; border: 1px solid #e3dccd; border-radius: 10px; background: #ffffff; color: #5b6576; font-size: 14px; font-weight: 600; cursor: pointer;\">Not interested<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; flex-wrap: wrap; gap: 10px; border-top: 1px solid #e3dccd; padding-top: 18px;\">\n    <button type=\"button\" style=\"min-height: 48px; padding: 0 20px; border: 0; border-radius: 10px; background: #1d4f91; color: #ffffff; font-size: 14px; font-weight: 600; cursor: pointer;\">Copy all for prospect's WhatsApp<\u002Fbutton>\n    <button type=\"button\" style=\"min-height: 48px; padding: 0 20px; border: 1.5px solid #1d4f91; border-radius: 10px; background: #ffffff; color: #1d4f91; font-size: 14px; font-weight: 600; cursor: pointer;\">Preview text<\u002Fbutton>\n    <button type=\"button\" style=\"min-height: 48px; padding: 0 20px; border: 1.5px solid #1d4f91; border-radius: 10px; background: #ffffff; color: #1d4f91; font-size: 14px; font-weight: 600; cursor: pointer;\">Download PDF<\u002Fbutton>\n    <button type=\"button\" style=\"min-height: 48px; padding: 0 20px; border: 1.5px dashed #1d4f91; border-radius: 10px; background: #ffffff; color: #1d4f91; font-size: 14px; font-weight: 600; cursor: pointer;\">Combine all modules<\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{save}}\" style=\"{{saveStyle}}\">{{saveLabel}}<\u002Fbutton>\n  <\u002Fdiv>\n  <p style=\"margin: 0; font-size: 12px; line-height: 1.7; color: #5b6576; max-width: 900px;\">Responses are conversation guides for registered agents. Product terms, contributions and Shariah positions must follow the operator's official materials.<\u002Fp>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:2200}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = {\n      edit: false, closed: {}, marked: {}, savedAt: '',\n      specific: [\n        { q: 'I’m young and healthy, why now?', a: 'This is when the contribution is lowest and your health record is clean. After a diagnosis, that condition may be excluded or the application declined.' },\n        { q: 'Government hospitals are cheap, right?', a: 'They are good, but you can’t choose your doctor or timing, and there can be waiting lists. If you still choose government care, many plans pay a daily cash allowance.' },\n        { q: 'My company already has a panel.', a: 'Panel annual limits are usually low and end when you leave the job. Your own card complements the company benefit.' },\n        { q: 'Can the contribution go up?', a: 'Yes, it isn’t guaranteed. The operator notifies participants before any change takes effect; check the notice period in the certificate.' },\n        { q: 'If I never claim, is it wasted?', a: 'Your tabarru’ helps other participants. Some plans also have a cash value account (not guaranteed).' },\n        { q: 'Can I use it from day one?', a: 'For accidents, typically yes. Common illness after 30 days, specified illness after 120 days. Don’t wait until symptoms appear.' }\n      ],\n      faq: [\n        { q: 'What happens at the hospital?', a: 'Show card & IC → hospital requests a GL → treated without a big deposit → pay a small portion (e.g. the deductible and items not covered).' },\n        { q: 'What if the room costs more than my limit?', a: 'You pay the difference. If the room is cheaper, the balance is not paid out.' },\n        { q: 'Are pre-existing conditions covered?', a: 'No. Declare honestly; if hidden, a claim can be rejected or the certificate terminated.' },\n        { q: 'Can I cancel after signing up?', a: 'Yes, within the 15-day free-look period after receiving the certificate, with a full refund less any medical examination costs.' }\n      ],\n      groups: [\n        { name: 'Money', items: [\n          { q: 'No money / tight budget.', a: 'Understood. We don’t need everything now. Cover the biggest risk first with an amount that feels comfortable, then add when the budget allows.' },\n          { q: 'More expensive than other companies.', a: 'Let’s compare like for like: annual limit, waiting period, deductible, expiry age and extra benefits. I can lay them side by side.' },\n          { q: 'Afraid I can’t keep paying later.', a: 'Pick a contribution that stays comfortable even in a tight month. Ask about a waiver rider so contributions are waived if the payer gets a critical illness.' },\n          { q: 'When my salary goes up.', a: 'By then your age and contribution go up too, and your health may change. Starting small now is safer.' }\n        ] },\n        { name: 'Delay', items: [\n          { q: 'Let me think about it first.', a: 'Of course. Which part are you unsure about? If it’s the contribution, we adjust. If it’s the benefits, I’ll explain again. I’ll send a short summary now.' },\n          { q: 'Need to discuss with my wife / husband.', a: 'Good, it’s a family decision. Can we schedule a short session together so they hear the full story?' },\n          { q: 'I’ll contact you later.', a: 'I respect that. May I follow up on [date]? Meanwhile, the risk doesn’t wait for us to be ready.' },\n          { q: 'Only at the end of the month.', a: 'We can fill in the form and start underwriting first. The first payment can follow the date that suits you.' }\n        ] },\n        { name: 'Trust', items: [\n          { q: 'Takaful claims are difficult.', a: 'Most rejected claims come from undisclosed health information, waiting periods or exclusions. That’s why we declare fully from the start, and I’ll help with any claim.' },\n          { q: 'Agents disappear after the sale.', a: 'A fair worry. You’ll have my number, and we’ll review the plan every year. I can show you my servicing and claims record.' },\n          { q: 'My friend got rejected.', a: 'May I know why? Usually it’s non-disclosure or an illness within the waiting period. We avoid that by filling the form properly.' },\n          { q: 'My relative is also an agent.', a: 'No problem. What matters is that you’re properly covered. If you already have a plan, I can review it for free to check the gap.' }\n        ] },\n        { name: 'Perception & religion', items: [\n          { q: 'Takaful means not accepting fate (takdir).', a: 'Takaful is ikhtiar, like wearing a seatbelt: tie your camel, then put your trust in Allah. Fate belongs to Allah; we manage the impact on the family.' },\n          { q: 'It’s like gambling / riba.', a: 'Takaful uses tabarru’: participants donate into a shared fund to help each other, overseen by the operator’s Shariah committee and regulated by BNM.' },\n          { q: 'The money is lost if I don’t claim.', a: 'The tabarru’ portion helps other participants in hardship. Investment-linked plans also have a cash value (not guaranteed).' },\n          { q: 'Afraid that buying it will make it happen.', a: 'Taking takaful doesn’t invite misfortune. It only means that when it comes, the family doesn’t carry it alone.' }\n        ] },\n        { name: 'Feels covered enough', items: [\n          { q: 'I’m healthy, I don’t need it.', a: 'Being healthy is exactly why you qualify and pay less. Once ill, the application may be declined or carry exclusions.' },\n          { q: 'I’m already covered.', a: 'Let’s check your existing certificate: amount, limits, expiry age and exclusions. If it’s enough, I’ll tell you straight.' },\n          { q: 'I want to compare other products first.', a: 'Please do. I’ll list the questions to ask any agent so the comparison is fair.' }\n        ] }\n      ]\n    };\n  }\n  renderVals() {\n    const s = this.state;\n    const edit = s.edit;\n    const mk = (key, x, setFn) => {\n      const op = !s.closed[key];\n      const m = !!s.marked[key];\n      return {\n        q: x.q, a: x.a, id: 'mta-' + key, open: op, view: !edit, editing: edit,\n        expandedStr: op ? 'true' : 'false', sign: op ? '−' : '+',\n        toggle: () => this.setState({ closed: Object.assign({}, s.closed, { [key]: op }) }), set: setFn,\n        mark: () => this.setState({ marked: Object.assign({}, s.marked, { [key]: !m }) }),\n        markedStr: m ? 'true' : 'false', markLabel: m ? 'Raised ✓ logged' : 'Mark as raised',\n        markStyle: 'align-self: flex-start; min-height: 40px; padding: 0 14px; border-radius: 9999px; font-size: 13px; font-weight: 600; cursor: pointer; ' + (m ? 'background: #0f4c35; color: #ffffff; border: 0;' : 'background: #ffffff; color: #0f2540; border: 1px solid #0f2540;')\n      };\n    };\n    const editList = (field, i) => (e) => { const next = s[field].slice(); next[i] = Object.assign({}, next[i], { a: e.target.value }); this.setState({ [field]: next }); };\n    const groups = s.groups.map((g, gi) => ({\n      name: g.name, count: String(g.items.length),\n      items: g.items.map((x, i) => mk('g' + gi + '-' + i, x, (e) => {\n        const next = s.groups.map((gg) => ({ name: gg.name, items: gg.items.slice() }));\n        next[gi].items[i] = Object.assign({}, next[gi].items[i], { a: e.target.value });\n        this.setState({ groups: next });\n      }))\n    }));\n    return {\n      specific: s.specific.map((x, i) => mk('s' + i, x, editList('specific', i))),\n      faq: s.faq.map((x, i) => mk('f' + i, x, editList('faq', i))),\n      groups: groups, edit: edit, editStr: edit ? 'true' : 'false',\n      raisedCount: String(Object.keys(s.marked).filter((k) => s.marked[k]).length),\n      editLabel: edit ? 'Done customizing' : 'Customize answers',\n      editBtnStyle: 'min-height: 44px; padding: 0 16px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; ' + (edit ? 'background: #fac748; color: #0f2540; border: 0;' : 'background: #ffffff; color: #0f2540; border: 1.5px solid #0f2540;'),\n      toggleEdit: () => this.setState({ edit: !edit }),\n      saveLabel: s.savedAt ? 'Saved ✓ ' + s.savedAt : 'Save',\n      saveStyle: 'min-height: 44px; padding: 0 18px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; border: 0; ' + (s.savedAt ? 'background: #0f7a4c; color: #ffffff;' : 'background: #0f2540; color: #fdf9f3;'),\n      save: () => { const d = new Date(); this.setState({ savedAt: String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') }); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
