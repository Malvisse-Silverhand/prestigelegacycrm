<style>
body{margin:0;background:#fdf9f3}
button,input{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus{outline:3px solid #fac748;outline-offset:2px}
@keyframes ping{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.6);opacity:0}}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.ping{transform-origin:center;transform-box:fill-box;animation:ping 1.8s ease-out infinite}
.pop{animation:pop .45s cubic-bezier(.16,1,.3,1) both}
@media (prefers-reduced-motion:reduce){.ping,.pop{animation:none}}

</helmet>
<div style="font-family: Poppins, system-ui, sans-serif; color: #1c2433; background: #fdf9f3; min-height: 100vh; display: flex; flex-direction: column;">

  <header style="background: #0f2540; color: #fdf9f3; padding: 16px 16px 20px; display: flex; align-items: center; gap: 10px;">
    <a href="PortalLogin.dc.html" aria-label="Back to log in" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; color: #fdf9f3; text-decoration: none; font-size: 22px;">‹</a>
    <span style="font-size: 15px; font-weight: 700;">Verify it's you</span>
    <span style="margin-left: auto; font-size: 11px; font-weight: 800; letter-spacing: .08em; color: #0f2540; background: #fac748; border-radius: 9999px; padding: 4px 10px;">RECOMMENDED</span>
  </header>

  <main style="flex: 1; padding: 24px 16px; display: flex; flex-direction: column; gap: 20px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;">
      <svg aria-hidden="true" width="96" height="96" sc-camel-view-box="0 0 96 96">
        <circle class="ping" cx="48" cy="48" r="30" fill="#0f7a4c" opacity=".35"></circle>
        <circle cx="48" cy="48" r="30" fill="#0f7a4c"></circle>
        <path d="M35 60 l3-9 a14 14 0 1 1 6 5 Z" fill="#ffffff"></path>
        <path d="M44 42 q1 6 8 9" fill="none" stroke="#0f7a4c" stroke-width="3" stroke-linecap="round"></path>
      </svg>
      <h1 style="margin: 0; font-size: 22px; font-weight: 800; color: #0f2540;">Check your WhatsApp</h1>
      <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #3d4757;">We sent a 6-digit code to <b style="font-variant-numeric: tabular-nums;">+60 12-*** 6789</b>. It expires in 5 minutes.</p>
    </div>

    <form sc-camel-on-submit="{{submit}}" style="background: #ffffff; border: 1px solid #e3dccd; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 14px;">
      <label for="pv-code" style="font-size: 13px; font-weight: 600; color: #0f2540;">6-digit code</label>
      <input id="pv-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" value="{{code}}" sc-camel-on-change="{{setCode}}" aria-describedby="pv-hint" style="min-height: 56px; border: 1px solid #d6cdb9; border-radius: 12px; padding: 0 14px; font-size: 26px; font-weight: 700; letter-spacing: .5em; text-align: center; background: #fdf9f3; color: #0f2540; font-variant-numeric: tabular-nums;">
      <div aria-hidden="true" style="display: flex; gap: 6px; justify-content: center;">
        <sc-for list="{{boxes}}" as="b" hint-placeholder-count="6"><span style="{{b.style}}"></span></sc-for>
      </div>
      <p id="pv-hint" aria-live="polite" style="margin: 0; font-size: 12px; color: #5b6576; text-align: center;">{{hint}}</p>
      <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
        <a class="pop" href="PortalHome.dc.html" style="min-height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #0f7a4c; color: #ffffff; font-size: 16px; font-weight: 800; text-decoration: none;">Verified ✓ Open my storyboards</a>
      </sc-if>
      <sc-if value="{{notDone}}" hint-placeholder-val="{{true}}">
        <button type="submit" style="min-height: 52px; border: 0; border-radius: 14px; background: #fac748; color: #0f2540; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 0 #d9a92c;">Verify</button>
      </sc-if>
      <button type="button" sc-camel-on-click="{{resend}}" style="min-height: 44px; border: 0; background: transparent; color: #0f2540; font-size: 13px; font-weight: 600; text-decoration: underline; cursor: pointer;">{{resendLabel}}</button>
    </form>

    <p style="margin: 0; font-size: 12px; line-height: 1.6; color: #5b6576; text-align: center;">Wrong number? Ask your agent to update it. The code is never asked for by phone call.</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { code: '', sent: 1, done: false };
  }
  renderVals() {
    const s = this.state;
    const d = String(s.code).replace(/\D/g, '').slice(0, 6);
    return {
      code: d,
      setCode: (e) => { const v = String(e.target.value).replace(/\D/g, '').slice(0, 6); this.setState({ code: v, done: false }); },
      boxes: [0, 1, 2, 3, 4, 5].map((i) => ({ style: 'width: 28px; height: 4px; border-radius: 9999px; transition: background .2s; background: ' + (i < d.length ? '#fac748' : '#e3dccd') + ';' })),
      hint: d.length === 6 ? 'Code complete. Tap Verify.' : (6 - d.length) + ' digits to go',
      done: s.done, notDone: !s.done,
      submit: (e) => { if (e && e.preventDefault) e.preventDefault(); if (d.length === 6) this.setState({ done: true }); },
      resend: () => this.setState({ sent: s.sent + 1, code: '', done: false }),
      resendLabel: s.sent > 1 ? 'New code sent (' + s.sent + ')' : 'Resend code'
    };
  }
}
</script>
